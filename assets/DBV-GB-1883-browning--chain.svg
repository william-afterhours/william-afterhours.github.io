<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="600" viewBox="0 0 1240 600" font-family="'Helvetica Neue',Helvetica,Arial,'Noto Sans',sans-serif">
<rect width="1240" height="600" fill="#faf8f8"/>
<text x="40" y="38" font-size="19" font-weight="700" fill="#2b2b2b">Louisa Browning, London 1883 — the deathbed, the letter written eight days later, and the letter's road into print</text>
<text x="40" y="60" font-size="11.5" fill="#6b6b6b">Facts from §3 and §4 of card DBV-GB-1883-browning (the letter as printed in JASPR, July 1909, pp. 422–423; civil death index). This is a diagram by</text>
<text x="40" y="75" font-size="11.5" fill="#6b6b6b">William, not a record.</text>
<rect x="40" y="102" width="76" height="118" rx="4" fill="#284b63"/>
<text x="78.0" y="166.0" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">THE EVENT</text>
<rect x="126" y="102" width="258" height="118" rx="6" fill="#eef2f5" stroke="#284b63" stroke-width="1"/>
<text x="136" y="122" font-size="12.5" font-weight="700" fill="#b5541c">July 1867</text>
<text x="136" y="140" font-size="12" fill="#2b2b2b">Amelia Jane Ericsson,</text>
<text x="136" y="156" font-size="12" fill="#2b2b2b">wife of John Ericsson,</text>
<text x="136" y="172" font-size="12" fill="#2b2b2b">dies in Marylebone, aged 50</text>
<path d="M386,161.0 L395,161.0" stroke="#284b63" stroke-width="1.5"/>
<path d="M391,157.0 L396,161.0 L391,165.0" fill="none" stroke="#284b63" stroke-width="1.5"/>
<rect x="398" y="102" width="258" height="118" rx="6" fill="#eef2f5" stroke="#284b63" stroke-width="1"/>
<text x="408" y="122" font-size="12.5" font-weight="700" fill="#b5541c">9 July 1868</text>
<text x="408" y="140" font-size="12" fill="#2b2b2b">Her niece Ellen Browning,</text>
<text x="408" y="156" font-size="12" fill="#2b2b2b">of Auckland, marries</text>
<text x="408" y="172" font-size="12" fill="#2b2b2b">General Sir Trevor Chute</text>
<path d="M658,161.0 L667,161.0" stroke="#284b63" stroke-width="1.5"/>
<path d="M663,157.0 L668,161.0 L663,165.0" fill="none" stroke="#284b63" stroke-width="1.5"/>
<rect x="670" y="102" width="258" height="118" rx="6" fill="#eef2f5" stroke="#284b63" stroke-width="1"/>
<text x="680" y="122" font-size="12.5" font-weight="700" fill="#b5541c">Fri 26 Oct 1883</text>
<text x="680" y="140" font-size="12" fill="#2b2b2b">Amelia's sister Louisa</text>
<text x="680" y="156" font-size="12" fill="#2b2b2b">Browning, 78, diabetic, falls</text>
<text x="680" y="172" font-size="12" fill="#2b2b2b">in her bedroom; found by</text>
<text x="680" y="188" font-size="12" fill="#2b2b2b">her servant; never rallies</text>
<path d="M930,161.0 L939,161.0" stroke="#284b63" stroke-width="1.5"/>
<path d="M935,157.0 L940,161.0 L935,165.0" fill="none" stroke="#284b63" stroke-width="1.5"/>
<rect x="942" y="102" width="258" height="118" rx="6" fill="#eef2f5" stroke="#284b63" stroke-width="1"/>
<text x="952" y="122" font-size="12.5" font-weight="700" fill="#b5541c">Sun 28 Oct 1883, early</text>
<text x="952" y="140" font-size="12" fill="#2b2b2b">Unconscious, then: 'Oh Amelia!</text>
<text x="952" y="156" font-size="12" fill="#2b2b2b">Amelia!' — reaches out her hand;</text>
<text x="952" y="172" font-size="12" fill="#2b2b2b">dies at once. Heard by 'those</text>
<text x="952" y="188" font-size="12" fill="#2b2b2b">watching by her' (unnamed)</text>
<path d="M1071.0,220 L1071.0,228.0 L255.0,228.0 L255.0,233" fill="none" stroke="#284b63" stroke-width="1.2" stroke-dasharray="4,3"/>
<path d="M251.0,228 L255.0,234 L259.0,228" fill="none" stroke="#284b63" stroke-width="1.2"/>
<rect x="40" y="236" width="76" height="118" rx="4" fill="#284b63"/>
<text x="78.0" y="300.0" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">THE RECORD</text>
<rect x="126" y="236" width="258" height="118" rx="6" fill="#fbf1ea" stroke="#284b63" stroke-width="1"/>
<text x="136" y="256" font-size="12.5" font-weight="700" fill="#b5541c">5 Nov 1883 · 8 days later</text>
<text x="136" y="274" font-size="12" fill="#2b2b2b">Lady Chute writes from Egmont,</text>
<text x="136" y="290" font-size="12" fill="#2b2b2b">Bracknell, to Capt. Ericsson in</text>
<text x="136" y="306" font-size="12" fill="#2b2b2b">New York: a family letter, not</text>
<text x="136" y="322" font-size="12" fill="#2b2b2b">written for publication</text>
<path d="M386,295.0 L395,295.0" stroke="#284b63" stroke-width="1.5"/>
<path d="M391,291.0 L396,295.0 L391,299.0" fill="none" stroke="#284b63" stroke-width="1.5"/>
<rect x="398" y="236" width="258" height="118" rx="6" fill="#fbf1ea" stroke="#284b63" stroke-width="1"/>
<text x="408" y="256" font-size="12.5" font-weight="700" fill="#b5541c">8 Mar 1889</text>
<text x="408" y="274" font-size="12" fill="#2b2b2b">Ericsson dies in New York.</text>
<text x="408" y="290" font-size="12" fill="#2b2b2b">His papers go to his</text>
<text x="408" y="306" font-size="12" fill="#2b2b2b">biographer, W. C. Church</text>
<path d="M658,295.0 L667,295.0" stroke="#284b63" stroke-width="1.5"/>
<path d="M663,291.0 L668,295.0 L663,299.0" fill="none" stroke="#284b63" stroke-width="1.5"/>
<rect x="670" y="236" width="258" height="118" rx="6" fill="#fbf1ea" stroke="#284b63" stroke-width="1"/>
<text x="680" y="256" font-size="12.5" font-weight="700" fill="#b5541c">1890 →</text>
<text x="680" y="274" font-size="12" fill="#2b2b2b">Church writes the Life of</text>
<text x="680" y="290" font-size="12" fill="#2b2b2b">Ericsson (1890); finds the</text>
<text x="680" y="306" font-size="12" fill="#2b2b2b">letter among the papers</text>
<text x="680" y="322" font-size="12" fill="#2b2b2b">and happens to keep it</text>
<path d="M930,295.0 L939,295.0" stroke="#284b63" stroke-width="1.5"/>
<path d="M935,291.0 L940,295.0 L935,299.0" fill="none" stroke="#284b63" stroke-width="1.5"/>
<rect x="942" y="236" width="258" height="118" rx="6" fill="#fbf1ea" stroke="#284b63" stroke-width="1"/>
<text x="952" y="256" font-size="12.5" font-weight="700" fill="#b5541c">Civil index (checked 2026)</text>
<text x="952" y="274" font-size="12" fill="#2b2b2b">Deaths Oct–Dec 1883,</text>
<text x="952" y="290" font-size="12" fill="#2b2b2b">Kensington: Browning, Louisa,</text>
<text x="952" y="306" font-size="12" fill="#2b2b2b">age 78. Deaths Jul–Sep 1867,</text>
<text x="952" y="322" font-size="12" fill="#2b2b2b">Marylebone: Ericsson, Amelia Jane, 50</text>
<path d="M1071.0,354 L1071.0,362.0 L255.0,362.0 L255.0,367" fill="none" stroke="#284b63" stroke-width="1.2" stroke-dasharray="4,3"/>
<path d="M251.0,362 L255.0,368 L259.0,362" fill="none" stroke="#284b63" stroke-width="1.2"/>
<rect x="40" y="370" width="76" height="118" rx="4" fill="#284b63"/>
<text x="78.0" y="434.0" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">INTO PRINT</text>
<rect x="126" y="370" width="258" height="118" rx="6" fill="#e4ebe4" stroke="#284b63" stroke-width="1"/>
<text x="136" y="390" font-size="12.5" font-weight="700" fill="#b5541c">17 Aug 1908</text>
<text x="136" y="408" font-size="12" fill="#2b2b2b">Church sends the original</text>
<text x="136" y="424" font-size="12" fill="#2b2b2b">letter to the editor of</text>
<text x="136" y="440" font-size="12" fill="#2b2b2b">The Open Court, Chicago</text>
<path d="M386,429.0 L395,429.0" stroke="#284b63" stroke-width="1.5"/>
<path d="M391,425.0 L396,429.0 L391,433.0" fill="none" stroke="#284b63" stroke-width="1.5"/>
<rect x="398" y="370" width="258" height="118" rx="6" fill="#e4ebe4" stroke="#284b63" stroke-width="1"/>
<text x="408" y="390" font-size="12.5" font-weight="700" fill="#b5541c">1908–09</text>
<text x="408" y="408" font-size="12" fill="#2b2b2b">The editor passes it to</text>
<text x="408" y="424" font-size="12" fill="#2b2b2b">D. P. Abbott, who passes it</text>
<text x="408" y="440" font-size="12" fill="#2b2b2b">to J. H. Hyslop (ASPR)</text>
<path d="M658,429.0 L667,429.0" stroke="#284b63" stroke-width="1.5"/>
<path d="M663,425.0 L668,429.0 L663,433.0" fill="none" stroke="#284b63" stroke-width="1.5"/>
<rect x="670" y="370" width="258" height="118" rx="6" fill="#e4ebe4" stroke="#284b63" stroke-width="1"/>
<text x="680" y="390" font-size="12.5" font-weight="700" fill="#b5541c">July 1909</text>
<text x="680" y="408" font-size="12" fill="#2b2b2b">Hyslop prints the letter in</text>
<text x="680" y="424" font-size="12" fill="#2b2b2b">JASPR III(7) pp. 422–423,</text>
<text x="680" y="440" font-size="12" fill="#2b2b2b">omitting 'personal' passages;</text>
<text x="680" y="456" font-size="12" fill="#2b2b2b">describes the yellowed paper</text>
<path d="M930,429.0 L939,429.0" stroke="#284b63" stroke-width="1.5"/>
<path d="M935,425.0 L940,429.0 L935,433.0" fill="none" stroke="#284b63" stroke-width="1.5"/>
<rect x="942" y="370" width="258" height="118" rx="6" fill="#e4ebe4" stroke="#284b63" stroke-width="1"/>
<text x="952" y="390" font-size="12.5" font-weight="700" fill="#b5541c">1926</text>
<text x="952" y="408" font-size="12" fill="#2b2b2b">Barrett reprints it, abridged,</text>
<text x="952" y="424" font-size="12" fill="#2b2b2b">in Death-bed Visions</text>
<text x="952" y="440" font-size="12" fill="#2b2b2b">pp. 44–45 (chapter III)</text>
<rect x="40" y="514" width="1160" height="66" rx="6" fill="#ffffff" stroke="#b5541c" stroke-width="1"/>
<text x="52" y="534" font-size="12" fill="#2b2b2b">Grades: S1 2 (contemporary letter) · S2 0 (the writer was not present; the watchers are unnamed) · S3 2 (8 days) · S4 1 · S6 1 (Hyslop checked provenance by letter)</text>
<text x="52" y="550" font-size="12" fill="#2b2b2b">· S7 2 → 6/10, but cap ③ (S2 = 0) → R C · no verified information (V—) · independence I2 (record 1883, before the 1900 baseline; no non-Western record of the</text>
<text x="52" y="566" font-size="12" fill="#2b2b2b">structure in English by 1883)</text>
</svg>
