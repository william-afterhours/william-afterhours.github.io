<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="600" viewBox="0 0 1240 600" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic','Helvetica Neue',Arial,sans-serif">
<rect width="1240" height="600" fill="#faf8f8"/>
<text x="40" y="38" font-size="19" font-weight="700" fill="#2b2b2b">장 부인, 중국, 1793년 이전 — 기록이 종이에 이르는 길, 그리고 열려 있는 두 차용 경로</text>
<text x="40" y="60" font-size="11.5" fill="#6b6b6b">카드 DBV-CN-1793-zhang 3·4·11절의 사실(지윤 『고망청지』 1793년 서문, 『사고전서총목』 125권, 대정장 412번). 윌리엄이 그린 도해이며 기록이</text>
<text x="40" y="75" font-size="11.5" fill="#6b6b6b">아니다.</text>
<rect x="40" y="102" width="76" height="118" rx="4" fill="#284b63"/>
<text x="78.0" y="166.0" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">기록</text>
<rect x="126" y="102" width="258" height="118" rx="6" fill="#fbf1ea" stroke="#284b63" stroke-width="1"/>
<text x="136" y="122" font-size="12.5" font-weight="700" fill="#b5541c">1793년 이전 · 날짜 없음</text>
<text x="136" y="140" font-size="12" fill="#2b2b2b">병이 위중해지자 장 부인이</text>
<text x="136" y="156" font-size="12" fill="#2b2b2b">'먼저 간 이들이 보인다'고</text>
<text x="136" y="172" font-size="12" fill="#2b2b2b">말하고, 이끌러 온 이들이</text>
<text x="136" y="188" font-size="12" fill="#2b2b2b">모두 시댁 사람이라고 함</text>
<path d="M386,161.0 L395,161.0" stroke="#284b63" stroke-width="1.5"/>
<path d="M391,157.0 L396,161.0 L391,165.0" fill="none" stroke="#284b63" stroke-width="1.5"/>
<rect x="398" y="102" width="258" height="118" rx="6" fill="#fbf1ea" stroke="#284b63" stroke-width="1"/>
<text x="408" y="122" font-size="12.5" font-weight="700" fill="#b5541c">임종 자리</text>
<text x="408" y="140" font-size="12" fill="#2b2b2b">딸과 며느리들을 침상 앞에</text>
<text x="408" y="156" font-size="12" fill="#2b2b2b">불러 모음. 지윤의 셋째 숙모</text>
<text x="408" y="172" font-size="12" fill="#2b2b2b">(장씨)가 직접 들음</text>
<path d="M658,161.0 L667,161.0" stroke="#284b63" stroke-width="1.5"/>
<path d="M663,157.0 L668,161.0 L663,165.0" fill="none" stroke="#284b63" stroke-width="1.5"/>
<rect x="670" y="102" width="258" height="118" rx="6" fill="#fbf1ea" stroke="#284b63" stroke-width="1"/>
<text x="680" y="122" font-size="12.5" font-weight="700" fill="#b5541c">지윤에게 전해짐</text>
<text x="680" y="140" font-size="12" fill="#2b2b2b">숙모가 조카 지윤(1724–1805)</text>
<text x="680" y="156" font-size="12" fill="#2b2b2b">에게 이야기함. 지윤의 할머니가</text>
<text x="680" y="172" font-size="12" fill="#2b2b2b">장 부인의 언니. 들은 날짜는</text>
<text x="680" y="188" font-size="12" fill="#2b2b2b">알 수 없음</text>
<path d="M930,161.0 L939,161.0" stroke="#284b63" stroke-width="1.5"/>
<path d="M935,157.0 L940,161.0 L935,165.0" fill="none" stroke="#284b63" stroke-width="1.5"/>
<rect x="942" y="102" width="258" height="118" rx="6" fill="#fbf1ea" stroke="#284b63" stroke-width="1"/>
<text x="952" y="122" font-size="12.5" font-weight="700" fill="#b5541c">1793년 · 1800년 간행</text>
<text x="952" y="140" font-size="12" fill="#2b2b2b">지윤이 『고망청지』 3권에 적음</text>
<text x="952" y="156" font-size="12" fill="#2b2b2b">(서문: 건륭 계축년 7월 25일).</text>
<text x="952" y="172" font-size="12" fill="#2b2b2b">1800년 전집으로 간행</text>
<rect x="40" y="236" width="76" height="118" rx="4" fill="#284b63"/>
<text x="78.0" y="300.0" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">경로 ②</text>
<rect x="126" y="236" width="258" height="118" rx="6" fill="#eef2f5" stroke="#284b63" stroke-width="1"/>
<text x="136" y="256" font-size="12.5" font-weight="700" fill="#b5541c">1603년</text>
<text x="136" y="274" font-size="12" fill="#2b2b2b">마테오 리치 『천주실의』:</text>
<text x="136" y="290" font-size="12" fill="#2b2b2b">영혼은 죽지 않고 사후에</text>
<text x="136" y="306" font-size="12" fill="#2b2b2b">천당·지옥이 있다</text>
<text x="136" y="322" font-size="12" fill="#2b2b2b">(사고전서총목 해제)</text>
<path d="M386,295.0 L395,295.0" stroke="#284b63" stroke-width="1.5"/>
<path d="M391,291.0 L396,295.0 L391,299.0" fill="none" stroke="#284b63" stroke-width="1.5"/>
<rect x="398" y="236" width="258" height="118" rx="6" fill="#eef2f5" stroke="#284b63" stroke-width="1"/>
<text x="408" y="256" font-size="12.5" font-weight="700" fill="#b5541c">1608년</text>
<text x="408" y="274" font-size="12" fill="#2b2b2b">리치 『기인십편』: 열 편 중</text>
<text x="408" y="290" font-size="12" fill="#2b2b2b">두 편이 '죽음의 때를 늘</text>
<text x="408" y="306" font-size="12" fill="#2b2b2b">생각하라'(사고전서총목 해제)</text>
<path d="M658,295.0 L667,295.0" stroke="#284b63" stroke-width="1.5"/>
<path d="M663,291.0 L668,295.0 L663,299.0" fill="none" stroke="#284b63" stroke-width="1.5"/>
<rect x="670" y="236" width="258" height="118" rx="6" fill="#eef2f5" stroke="#284b63" stroke-width="1"/>
<text x="680" y="256" font-size="12.5" font-weight="700" fill="#b5541c">1772–1782년</text>
<text x="680" y="274" font-size="12" fill="#2b2b2b">『사고전서총목』이 이 기독교</text>
<text x="680" y="290" font-size="12" fill="#2b2b2b">서적들을 해제함. 지윤 서문:</text>
<text x="680" y="306" font-size="12" fill="#2b2b2b">'쉰 이후 비서 편찬을</text>
<text x="680" y="322" font-size="12" fill="#2b2b2b">맡았다'</text>
<path d="M930,295.0 L939,295.0" stroke="#284b63" stroke-width="1.5"/>
<path d="M935,291.0 L940,295.0 L935,299.0" fill="none" stroke="#284b63" stroke-width="1.5"/>
<rect x="942" y="236" width="258" height="118" rx="6" fill="#eef2f5" stroke="#284b63" stroke-width="1"/>
<text x="952" y="256" font-size="12.5" font-weight="700" fill="#b5541c">확인 못 함</text>
<text x="952" y="274" font-size="12" fill="#2b2b2b">한문 기독교 문헌에 임종</text>
<text x="952" y="290" font-size="12" fill="#2b2b2b">방문자 기록이 있었는지,</text>
<text x="952" y="306" font-size="12" fill="#2b2b2b">이 집안에 닿았는지</text>
<text x="952" y="322" font-size="12" fill="#2b2b2b">→ 알 수 없음</text>
<rect x="40" y="370" width="76" height="118" rx="4" fill="#284b63"/>
<text x="78.0" y="434.0" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">경로 ③</text>
<rect x="126" y="370" width="258" height="118" rx="6" fill="#e4ebe4" stroke="#284b63" stroke-width="1"/>
<text x="136" y="390" font-size="12.5" font-weight="700" fill="#b5541c">7세기로 전해짐</text>
<text x="136" y="408" font-size="12" fill="#2b2b2b">『지장보살본원경』(대정장 412),</text>
<text x="136" y="424" font-size="12" fill="#2b2b2b">우전국 승려 실차난타가</text>
<text x="136" y="440" font-size="12" fill="#2b2b2b">번역했다고 전함</text>
<path d="M386,429.0 L395,429.0" stroke="#284b63" stroke-width="1.5"/>
<path d="M391,425.0 L396,429.0 L391,433.0" fill="none" stroke="#284b63" stroke-width="1.5"/>
<rect x="398" y="370" width="258" height="118" rx="6" fill="#e4ebe4" stroke="#284b63" stroke-width="1"/>
<text x="408" y="390" font-size="12.5" font-weight="700" fill="#b5541c">그 경의 임종 대목</text>
<text x="408" y="408" font-size="12" fill="#2b2b2b">착한 사람도 죽을 때 귀신들이</text>
<text x="408" y="424" font-size="12" fill="#2b2b2b">'부모와 친척으로 변해'</text>
<text x="408" y="440" font-size="12" fill="#2b2b2b">와서 이끌어 간다</text>
<path d="M658,429.0 L667,429.0" stroke="#284b63" stroke-width="1.5"/>
<path d="M663,425.0 L668,429.0 L663,433.0" fill="none" stroke="#284b63" stroke-width="1.5"/>
<rect x="670" y="370" width="258" height="118" rx="6" fill="#e4ebe4" stroke="#284b63" stroke-width="1"/>
<text x="680" y="390" font-size="12.5" font-weight="700" fill="#b5541c">기원 논쟁</text>
<text x="680" y="408" font-size="12" fill="#2b2b2b">산스크리트 원본 없음.</text>
<text x="680" y="424" font-size="12" fill="#2b2b2b">중국 찬술설 있음(단서만:</text>
<text x="680" y="440" font-size="12" fill="#2b2b2b">버스웰 1990, 미열람)</text>
<path d="M930,429.0 L939,429.0" stroke="#284b63" stroke-width="1.5"/>
<path d="M935,425.0 L940,429.0 L935,433.0" fill="none" stroke="#284b63" stroke-width="1.5"/>
<rect x="942" y="370" width="258" height="118" rx="6" fill="#e4ebe4" stroke="#284b63" stroke-width="1"/>
<text x="952" y="390" font-size="12.5" font-weight="700" fill="#b5541c">기록 안에서</text>
<text x="952" y="408" font-size="12" fill="#2b2b2b">'죽어 가는 사람은 먼저 간</text>
<text x="952" y="424" font-size="12" fill="#2b2b2b">이들을 본다더니' — 이미</text>
<text x="952" y="440" font-size="12" fill="#2b2b2b">집안에 돌던 말</text>
<text x="952" y="456" font-size="12" fill="#2b2b2b">→ 알 수 없음</text>
<rect x="40" y="514" width="1160" height="66" rx="6" fill="#ffffff" stroke="#b5541c" stroke-width="1"/>
<text x="52" y="534" font-size="12" fill="#2b2b2b">등급: S1 1(증인에게 직접 들은 수집가) · S2 1(이름 있는 증인 한 명, 현장에 있었음) · S3 0(수십 년, 날짜 없음) · S4 0 · S6 1(집안 사람인 수집가,</text>
<text x="52" y="550" font-size="12" fill="#2b2b2b">검증 없음) · S7 2(청대 목판본 스캔 열람) → 3/10 → R C · 검증 정보 없음(V—) · 독립성 I1(경로 ②·③ 알 수 없음, ①④⑤ 배제)</text>
</svg>
