<text x="689.8" y="150.0" font-size="11.5" fill="#2b2b2b" font-weight="normal" text-anchor="end">뇌 전기 활동 소실: 대뇌(SSEP) 11:10부터, 뇌간(BAEP) 11:24부터</text>
