<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="760" viewBox="0 0 1240 760" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic','Noto Sans CJK KR',sans-serif">
<rect width="1240" height="760" fill="#faf8f8"/>
<text x="20.0" y="34.0" font-size="20" fill="#2b2b2b" font-weight="bold" text-anchor="start">1991년 피닉스 팸 레이놀즈 사례 — 수술의 시간표와 검증된 지각이 일어난 시각</text>
<text x="20.0" y="56.0" font-size="11.5" fill="#6b6b6b" font-weight="normal" text-anchor="start">시각은 수술 기록을 Sabom(2007)과 Augustine(2007, 그림 1)이 옮긴 것, 지각은 JNDS 2007–2011에 인용된 Sabom 1998. 카드 NDE-US-1991-reynolds 3절·6절의 사실만.</text>
