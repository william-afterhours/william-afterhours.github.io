<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="600" viewBox="0 0 1240 600" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic','Helvetica Neue',Arial,sans-serif">
<rect width="1240" height="600" fill="#faf8f8"/>
<text x="40" y="38" font-size="19" font-weight="700" fill="#2b2b2b">루이자 브라우닝, 런던 1883 — 임종, 여드레 뒤에 쓴 편지, 그리고 그 편지가 활자에 이르는 길</text>
<text x="40" y="60" font-size="11.5" fill="#6b6b6b">카드 DBV-GB-1883-browning 3절·4절의 사실(1909년 7월 JASPR 422–423쪽에 실린 편지, 사망 색인). 윌리엄이 그린 도해이며 기록이 아니다.</text>
<rect x="40" y="102" width="76" height="118" rx="4" fill="#284b63"/>
<text x="78.0" y="166.0" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">사건</text>
<rect x="126" y="102" width="258" height="118" rx="6" fill="#eef2f5" stroke="#284b63" stroke-width="1"/>
<text x="136" y="122" font-size="12.5" font-weight="700" fill="#b5541c">1867년 7월</text>
<text x="136" y="140" font-size="12" fill="#2b2b2b">존 에릭슨의 아내</text>
<text x="136" y="156" font-size="12" fill="#2b2b2b">아멜리아 제인 에릭슨,</text>
<text x="136" y="172" font-size="12" fill="#2b2b2b">메릴본에서 50세로 사망</text>
<path d="M386,161.0 L395,161.0" stroke="#284b63" stroke-width="1.5"/>
<path d="M391,157.0 L396,161.0 L391,165.0" fill="none" stroke="#284b63" stroke-width="1.5"/>
<rect x="398" y="102" width="258" height="118" rx="6" fill="#eef2f5" stroke="#284b63" stroke-width="1"/>
<text x="408" y="122" font-size="12.5" font-weight="700" fill="#b5541c">1868년 7월 9일</text>
<text x="408" y="140" font-size="12" fill="#2b2b2b">조카 엘런 브라우닝(오클랜드)이</text>
<text x="408" y="156" font-size="12" fill="#2b2b2b">트레버 슈트 장군과 결혼</text>
<path d="M658,161.0 L667,161.0" stroke="#284b63" stroke-width="1.5"/>
<path d="M663,157.0 L668,161.0 L663,165.0" fill="none" stroke="#284b63" stroke-width="1.5"/>
<rect x="670" y="102" width="258" height="118" rx="6" fill="#eef2f5" stroke="#284b63" stroke-width="1"/>
<text x="680" y="122" font-size="12.5" font-weight="700" fill="#b5541c">1883년 10월 26일(금)</text>
<text x="680" y="140" font-size="12" fill="#2b2b2b">아멜리아의 언니 루이자</text>
<text x="680" y="156" font-size="12" fill="#2b2b2b">브라우닝(78, 당뇨)이 침실에서</text>
<text x="680" y="172" font-size="12" fill="#2b2b2b">넘어짐. 하녀가 발견.</text>
<text x="680" y="188" font-size="12" fill="#2b2b2b">회복하지 못함</text>
<path d="M930,161.0 L939,161.0" stroke="#284b63" stroke-width="1.5"/>
<path d="M935,157.0 L940,161.0 L935,165.0" fill="none" stroke="#284b63" stroke-width="1.5"/>
<rect x="942" y="102" width="258" height="118" rx="6" fill="#eef2f5" stroke="#284b63" stroke-width="1"/>
<text x="952" y="122" font-size="12.5" font-weight="700" fill="#b5541c">1883년 10월 28일(일) 새벽</text>
<text x="952" y="140" font-size="12" fill="#2b2b2b">의식이 없다가 "오 아멜리아!</text>
<text x="952" y="156" font-size="12" fill="#2b2b2b">아멜리아!" — 손을 내밀고</text>
<text x="952" y="172" font-size="12" fill="#2b2b2b">곧 사망. '곁을 지키던 이들'</text>
<text x="952" y="188" font-size="12" fill="#2b2b2b">(이름 없음)이 들음</text>
<path d="M1071.0,220 L1071.0,228.0 L255.0,228.0 L255.0,233" fill="none" stroke="#284b63" stroke-width="1.2" stroke-dasharray="4,3"/>
<path d="M251.0,228 L255.0,234 L259.0,228" fill="none" stroke="#284b63" stroke-width="1.2"/>
<rect x="40" y="236" width="76" height="118" rx="4" fill="#284b63"/>
<text x="78.0" y="300.0" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">기록</text>
<rect x="126" y="236" width="258" height="118" rx="6" fill="#fbf1ea" stroke="#284b63" stroke-width="1"/>
<text x="136" y="256" font-size="12.5" font-weight="700" fill="#b5541c">1883년 11월 5일 · 8일 뒤</text>
<text x="136" y="274" font-size="12" fill="#2b2b2b">슈트 부인이 브랙넬 자택에서</text>
<text x="136" y="290" font-size="12" fill="#2b2b2b">뉴욕의 에릭슨 대령에게 편지.</text>
<text x="136" y="306" font-size="12" fill="#2b2b2b">가족 소식 편지이지</text>
<text x="136" y="322" font-size="12" fill="#2b2b2b">발표용 글이 아님</text>
<path d="M386,295.0 L395,295.0" stroke="#284b63" stroke-width="1.5"/>
<path d="M391,291.0 L396,295.0 L391,299.0" fill="none" stroke="#284b63" stroke-width="1.5"/>
<rect x="398" y="236" width="258" height="118" rx="6" fill="#fbf1ea" stroke="#284b63" stroke-width="1"/>
<text x="408" y="256" font-size="12.5" font-weight="700" fill="#b5541c">1889년 3월 8일</text>
<text x="408" y="274" font-size="12" fill="#2b2b2b">에릭슨 뉴욕에서 사망.</text>
<text x="408" y="290" font-size="12" fill="#2b2b2b">문서는 전기 작가</text>
<text x="408" y="306" font-size="12" fill="#2b2b2b">W. C. 처치에게</text>
<path d="M658,295.0 L667,295.0" stroke="#284b63" stroke-width="1.5"/>
<path d="M663,291.0 L668,295.0 L663,299.0" fill="none" stroke="#284b63" stroke-width="1.5"/>
<rect x="670" y="236" width="258" height="118" rx="6" fill="#fbf1ea" stroke="#284b63" stroke-width="1"/>
<text x="680" y="256" font-size="12.5" font-weight="700" fill="#b5541c">1890년 →</text>
<text x="680" y="274" font-size="12" fill="#2b2b2b">처치가 『에릭슨 전기』(1890)를</text>
<text x="680" y="290" font-size="12" fill="#2b2b2b">쓰며 문서 더미에서</text>
<text x="680" y="306" font-size="12" fill="#2b2b2b">이 편지를 발견해</text>
<text x="680" y="322" font-size="12" fill="#2b2b2b">우연히 보관</text>
<path d="M930,295.0 L939,295.0" stroke="#284b63" stroke-width="1.5"/>
<path d="M935,291.0 L940,295.0 L935,299.0" fill="none" stroke="#284b63" stroke-width="1.5"/>
<rect x="942" y="236" width="258" height="118" rx="6" fill="#fbf1ea" stroke="#284b63" stroke-width="1"/>
<text x="952" y="256" font-size="12.5" font-weight="700" fill="#b5541c">사망 색인(2026년 확인)</text>
<text x="952" y="274" font-size="12" fill="#2b2b2b">1883년 10–12월 켄싱턴:</text>
<text x="952" y="290" font-size="12" fill="#2b2b2b">Browning, Louisa, 78세.</text>
<text x="952" y="306" font-size="12" fill="#2b2b2b">1867년 7–9월 메릴본:</text>
<text x="952" y="322" font-size="12" fill="#2b2b2b">Ericsson, Amelia Jane, 50세</text>
<path d="M1071.0,354 L1071.0,362.0 L255.0,362.0 L255.0,367" fill="none" stroke="#284b63" stroke-width="1.2" stroke-dasharray="4,3"/>
<path d="M251.0,362 L255.0,368 L259.0,362" fill="none" stroke="#284b63" stroke-width="1.2"/>
<rect x="40" y="370" width="76" height="118" rx="4" fill="#284b63"/>
<text x="78.0" y="434.0" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">활자로</text>
<rect x="126" y="370" width="258" height="118" rx="6" fill="#e4ebe4" stroke="#284b63" stroke-width="1"/>
<text x="136" y="390" font-size="12.5" font-weight="700" fill="#b5541c">1908년 8월 17일</text>
<text x="136" y="408" font-size="12" fill="#2b2b2b">처치가 편지 원본을</text>
<text x="136" y="424" font-size="12" fill="#2b2b2b">시카고 『오픈 코트』</text>
<text x="136" y="440" font-size="12" fill="#2b2b2b">편집자에게 보냄</text>
<path d="M386,429.0 L395,429.0" stroke="#284b63" stroke-width="1.5"/>
<path d="M391,425.0 L396,429.0 L391,433.0" fill="none" stroke="#284b63" stroke-width="1.5"/>
<rect x="398" y="370" width="258" height="118" rx="6" fill="#e4ebe4" stroke="#284b63" stroke-width="1"/>
<text x="408" y="390" font-size="12.5" font-weight="700" fill="#b5541c">1908–09년</text>
<text x="408" y="408" font-size="12" fill="#2b2b2b">편집자 → D. P. 애벗 →</text>
<text x="408" y="424" font-size="12" fill="#2b2b2b">J. H. 하이슬롭(ASPR)</text>
<path d="M658,429.0 L667,429.0" stroke="#284b63" stroke-width="1.5"/>
<path d="M663,425.0 L668,429.0 L663,433.0" fill="none" stroke="#284b63" stroke-width="1.5"/>
<rect x="670" y="370" width="258" height="118" rx="6" fill="#e4ebe4" stroke="#284b63" stroke-width="1"/>
<text x="680" y="390" font-size="12.5" font-weight="700" fill="#b5541c">1909년 7월</text>
<text x="680" y="408" font-size="12" fill="#2b2b2b">하이슬롭이 JASPR 3권 7호</text>
<text x="680" y="424" font-size="12" fill="#2b2b2b">422–423쪽에 편지를 실음.</text>
<text x="680" y="440" font-size="12" fill="#2b2b2b">'사적인' 대목은 뺌.</text>
<text x="680" y="456" font-size="12" fill="#2b2b2b">누렇게 바랜 종이를 묘사</text>
<path d="M930,429.0 L939,429.0" stroke="#284b63" stroke-width="1.5"/>
<path d="M935,425.0 L940,429.0 L935,433.0" fill="none" stroke="#284b63" stroke-width="1.5"/>
<rect x="942" y="370" width="258" height="118" rx="6" fill="#e4ebe4" stroke="#284b63" stroke-width="1"/>
<text x="952" y="390" font-size="12.5" font-weight="700" fill="#b5541c">1926년</text>
<text x="952" y="408" font-size="12" fill="#2b2b2b">바렛이 『임종 환시』</text>
<text x="952" y="424" font-size="12" fill="#2b2b2b">44–45쪽(3장)에</text>
<text x="952" y="440" font-size="12" fill="#2b2b2b">요약해 재수록</text>
<rect x="40" y="514" width="1160" height="66" rx="6" fill="#ffffff" stroke="#b5541c" stroke-width="1"/>
<text x="52" y="534" font-size="12" fill="#2b2b2b">등급: S1 2(당대 편지) · S2 0(쓴 이는 현장에 없었고 지켜본 이들은 이름이 없음) · S3 2(8일) · S4 1 · S6 1(하이슬롭이 서신으로 출처 확인) · S7</text>
<text x="52" y="550" font-size="12" fill="#2b2b2b">2 → 6/10이지만 상한 ③(S2=0) → R C · 검증 정보 없음(V—) · 독립성 I2(1883년 기록, 기준 연도 1900 이전; 1883년까지 영어로 열린 비서구 기록</text>
<text x="52" y="566" font-size="12" fill="#2b2b2b">없음)</text>
</svg>
