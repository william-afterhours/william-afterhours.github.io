<text x="20.0" y="34.0" font-size="20" fill="#2b2b2b" font-weight="bold" text-anchor="start">The Pam Reynolds case, Phoenix 1991 — the operation hour by hour, and when the verified perceptions occurred</text>
<text x="20.0" y="56.0" font-size="11.5" fill="#6b6b6b" font-weight="normal" text-anchor="start">Times from the operative record as restated by Sabom (2007) and Augustine (2007, Fig. 1); perceptions from Sabom 1998 as quoted in JNDS 2007–2011. Facts from §3 and §6 of card NDE-US-1991-reynolds only.</text>
<rect x="107.7" y="84" width="1017.0" height="20" rx="3" fill="#eef2f5" stroke="#284b63" stroke-width="1"/>
<text x="115.7" y="98.0" font-size="11.5" fill="#2b2b2b" font-weight="normal" text-anchor="start">General anaesthesia 7:15 → ~14:00 (thiopental, midazolam, sufentanil, vecuronium; isoflurane / nitrous oxide)</text>
<rect x="647.6" y="110" width="263.7" height="20" rx="3" fill="#d7e3ec" stroke="#284b63" stroke-width="1"/>
<text x="639.6" y="124.0" font-size="11.5" fill="#2b2b2b" font-weight="normal" text-anchor="end">Cardiopulmonary bypass: cooling from 10:50 · rewarming 11:30 → ~12:35</text>
<rect x="697.8" y="136" width="50.2" height="20" rx="3" fill="#fbf1ea" stroke="#b5541c" stroke-width="1"/>
<rect x="748.0" y="136" width="87.9" height="20" rx="3" fill="none" stroke="#b5541c" stroke-width="1" stroke-dasharray="4,3"/>
<text x="843.9" y="150.0" font-size="11" fill="#6b6b6b" font-weight="normal" text-anchor="start">end of silence not timed in the quoted record (anaesthetic resumed 12:05)</text>
<text x="689.8" y="150.0" font-size="11.5" fill="#2b2b2b" font-weight="normal" text-anchor="end">Brain electrically silent: cortex (SSEP) from 11:10, brainstem (BAEP) from 11:24</text>
<rect x="735.4" y="162" width="12.6" height="20" rx="2" fill="#b5541c"/>
<text x="756.0" y="176.0" font-size="11.5" fill="#b5541c" font-weight="bold" text-anchor="start">11:25–11:30 standstill: blood drained, aneurysm clipped (body ~15.5 °C)</text>
