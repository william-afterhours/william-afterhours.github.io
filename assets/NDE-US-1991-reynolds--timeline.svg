<line x1="823.3" y1="80" x2="823.3" y2="193" stroke="#284b63" stroke-width="0.4" stroke-dasharray="2,4"/>
<line x1="974.0" y1="210" x2="974.0" y2="220" stroke="#2b2b2b" stroke-width="1"/>
<text x="974.0" y="205.0" font-size="11" fill="#6b6b6b" font-weight="normal" text-anchor="middle">13:00</text>
<line x1="974.0" y1="80" x2="974.0" y2="193" stroke="#284b63" stroke-width="0.4" stroke-dasharray="2,4"/>
<line x1="1124.7" y1="210" x2="1124.7" y2="220" stroke="#2b2b2b" stroke-width="1"/>
<text x="1124.7" y="205.0" font-size="11" fill="#6b6b6b" font-weight="normal" text-anchor="middle">14:00</text>
<line x1="1124.7" y1="80" x2="1124.7" y2="193" stroke="#284b63" stroke-width="0.4" stroke-dasharray="2,4"/>
<line x1="107.7" y1="215" x2="107.7" y2="227" stroke="#6b6b6b" stroke-width="1"/>
<circle cx="107.7" cy="215" r="3.5" fill="#2b2b2b"/>
<text x="103.7" y="242.0" font-size="11.5" fill="#2b2b2b" font-weight="normal" text-anchor="start">7:15 anaesthesia</text>
<text x="103.7" y="257.0" font-size="11.5" fill="#2b2b2b" font-weight="normal" text-anchor="start">induced</text>
<line x1="326.1" y1="215" x2="326.1" y2="283" stroke="#b5541c" stroke-width="1.5"/>
<polygon points="326.1,207.0 328.2,212.1 333.7,212.5 329.6,216.1 330.8,221.5 326.1,218.6 321.4,221.5 322.7,216.1 318.5,212.5 324.0,212.1" fill="#b5541c" stroke="#ffffff" stroke-width="1"/>
<text x="322.1" y="298.0" font-size="11.5" fill="#b5541c" font-weight="normal" text-anchor="start">~8:40–8:50  ★1 ★2 ★3</text>
<text x="322.1" y="313.0" font-size="11.5" fill="#b5541c" font-weight="normal" text-anchor="start">drill sound · saw · a woman's</text>
<text x="322.1" y="328.0" font-size="11.5" fill="#b5541c" font-weight="normal" text-anchor="start">voice about small arteries</text>
<text x="322.1" y="343.0" font-size="11.5" fill="#b5541c" font-weight="normal" text-anchor="start">(anaesthetised, warm, eyes taped)</text>
<line x1="647.6" y1="215" x2="647.6" y2="227" stroke="#6b6b6b" stroke-width="1"/>
<circle cx="647.6" cy="215" r="3.5" fill="#2b2b2b"/>
<text x="643.6" y="242.0" font-size="11.5" fill="#2b2b2b" font-weight="normal" text-anchor="start">10:50 bypass on,</text>
<text x="643.6" y="257.0" font-size="11.5" fill="#2b2b2b" font-weight="normal" text-anchor="start">cooling begins</text>
<line x1="740.5" y1="215" x2="740.5" y2="283" stroke="#6b6b6b" stroke-width="1"/>
<circle cx="740.5" cy="215" r="3.5" fill="#2b2b2b"/>
<text x="736.5" y="298.0" font-size="11.5" fill="#2b2b2b" font-weight="normal" text-anchor="start">11:25–11:30 standstill</text>
<text x="736.5" y="313.0" font-size="11.5" fill="#2b2b2b" font-weight="normal" text-anchor="start">and clip; bypass back on,</text>
<text x="736.5" y="328.0" font-size="11.5" fill="#2b2b2b" font-weight="normal" text-anchor="start">rewarming (65 min)</text>
<line x1="835.9" y1="215" x2="835.9" y2="227" stroke="#6b6b6b" stroke-width="1"/>
<circle cx="835.9" cy="215" r="3.5" fill="#2b2b2b"/>
<text x="831.9" y="242.0" font-size="11.5" fill="#2b2b2b" font-weight="normal" text-anchor="start">12:05 isoflurane</text>
<text x="831.9" y="257.0" font-size="11.5" fill="#2b2b2b" font-weight="normal" text-anchor="start">resumed</text>
<line x1="948.9" y1="215" x2="948.9" y2="227" stroke="#6b6b6b" stroke-width="1"/>
<circle cx="948.9" cy="215" r="3.5" fill="#2b2b2b"/>
<text x="944.9" y="242.0" font-size="11.5" fill="#2b2b2b" font-weight="normal" text-anchor="start">12:50 nitrous</text>
<text x="944.9" y="257.0" font-size="11.5" fill="#2b2b2b" font-weight="normal" text-anchor="start">oxide resumed</text>
<line x1="1024.2" y1="215" x2="1024.2" y2="283" stroke="#b5541c" stroke-width="1.5"/>
<polygon points="1024.2,207.0 1026.3,212.1 1031.8,212.5 1027.6,216.1 1028.9,221.5 1024.2,218.6 1019.5,221.5 1020.8,216.1 1016.6,212.5 1022.1,212.1" fill="#b5541c" stroke="#ffffff" stroke-width="1"/>
<text x="1020.2" y="298.0" font-size="11.5" fill="#b5541c" font-weight="normal" text-anchor="start">~12:35–14:00 closing  ★4</text>
<text x="1020.2" y="313.0" font-size="11.5" fill="#b5541c" font-weight="normal" text-anchor="start">'Hotel California' playing</text>
<text x="1020.2" y="328.0" font-size="11.5" fill="#b5541c" font-weight="normal" text-anchor="start">as she 'returned'</text>
<line x1="1124.7" y1="215" x2="1124.7" y2="227" stroke="#6b6b6b" stroke-width="1"/>
<circle cx="1124.7" cy="215" r="3.5" fill="#2b2b2b"/>
<text x="1128.7" y="242.0" font-size="11.5" fill="#2b2b2b" font-weight="normal" text-anchor="end">~14:00 operation</text>
<text x="1128.7" y="257.0" font-size="11.5" fill="#2b2b2b" font-weight="normal" text-anchor="end">ends; 14:10 to</text>
<text x="1128.7" y="272.0" font-size="11.5" fill="#2b2b2b" font-weight="normal" text-anchor="end">recovery</text>
<text x="20.0" y="378.0" font-size="14" fill="#284b63" font-weight="bold" text-anchor="start">What Reynolds said that was confirmed (§6) — and when</text>
<rect x="20" y="390" width="1200" height="100" rx="6" fill="#eef2f5" stroke="#284b63" stroke-width="0.8"/>
<text x="32.0" y="414.0" font-size="11.5" fill="#b5541c" font-weight="bold" text-anchor="start">★1 The drill: "a natural D"</text>
<text x="32.0" y="433.0" font-size="11" fill="#2b2b2b" font-weight="normal" text-anchor="start">A pneumatic bone drill was in use;</text>
<text x="32.0" y="447.0" font-size="11" fill="#2b2b2b" font-weight="normal" text-anchor="start">the pitch itself cannot be checked</text>
<text x="32.0" y="471.0" font-size="10.5" fill="#6b6b6b" font-weight="normal" text-anchor="start">~8:45 · anaesthetised, normal temperature</text>
<text x="332.0" y="414.0" font-size="11.5" fill="#b5541c" font-weight="bold" text-anchor="start">★2 The saw and its case</text>
<text x="332.0" y="433.0" font-size="11" fill="#2b2b2b" font-weight="normal" text-anchor="start">blades in a "socket wrench case": accurate</text>
<text x="332.0" y="447.0" font-size="11" fill="#2b2b2b" font-weight="normal" text-anchor="start">"a groove at the top": does not fit the saw</text>
<text x="332.0" y="471.0" font-size="10.5" fill="#6b6b6b" font-weight="normal" text-anchor="start">~8:45 · same</text>
<text x="632.0" y="414.0" font-size="11.5" fill="#b5541c" font-weight="bold" text-anchor="start">★3 "Arteries too small… other side"</text>
<text x="632.0" y="433.0" font-size="11" fill="#2b2b2b" font-weight="normal" text-anchor="start">Record: bilateral femoral cut-downs</text>
<text x="632.0" y="447.0" font-size="11" fill="#2b2b2b" font-weight="normal" text-anchor="start">by the cardiac surgeon (a woman)</text>
<text x="632.0" y="471.0" font-size="10.5" fill="#6b6b6b" font-weight="normal" text-anchor="start">~8:40 (1 h 25 min after induction) · same</text>
<text x="932.0" y="414.0" font-size="11.5" fill="#b5541c" font-weight="bold" text-anchor="start">★4 "Hotel California"</text>
<text x="932.0" y="433.0" font-size="11" fill="#2b2b2b" font-weight="normal" text-anchor="start">Played in the operating room</text>
<text x="932.0" y="447.0" font-size="11" fill="#2b2b2b" font-weight="normal" text-anchor="start">during closing</text>
<text x="932.0" y="471.0" font-size="10.5" fill="#6b6b6b" font-weight="normal" text-anchor="start">after rewarming; anaesthetic resumed 12:05</text>
<text x="1210.0" y="507.0" font-size="11" fill="#6b6b6b" font-weight="normal" text-anchor="end">All four were known to people in the room → psi (H2) and survival (H1) cannot be separated. None falls inside the silent period (11:10/11:24 → ~11:30 and after).</text>
<text x="20.0" y="532.0" font-size="14" fill="#284b63" font-weight="bold" text-anchor="start">Other ways to explain it (§7) — hence the grades C / V1</text>
<rect x="20.0" y="544" width="288.0" height="184" rx="6" fill="#ffffff" stroke="#284b63" stroke-width="1.2"/>
<text x="32.0" y="568.0" font-size="14" fill="#284b63" font-weight="bold" text-anchor="start">Hearing under anaesthesia (L·N)</text>
<text x="32.0" y="590.0" font-size="12" fill="#2b2b2b" font-weight="normal" text-anchor="start">Awareness under general anaesthesia</text>
<text x="32.0" y="606.0" font-size="12" fill="#2b2b2b" font-weight="normal" text-anchor="start">occurs in ~1–2 per 1,000 (Augustine;</text>
<text x="32.0" y="622.0" font-size="12" fill="#2b2b2b" font-weight="normal" text-anchor="start">Woerlee). Against it: moulded ear</text>
<text x="32.0" y="638.0" font-size="12" fill="#2b2b2b" font-weight="normal" text-anchor="start">speakers, 100 dB clicks 11/s, white</text>
<text x="32.0" y="654.0" font-size="12" fill="#2b2b2b" font-weight="normal" text-anchor="start">noise; the surgeon: "inconceivable".</text>
<text x="32.0" y="670.0" font-size="12" fill="#2b2b2b" font-weight="normal" text-anchor="start">Woerlee: possible by bone conduction;</text>
<text x="32.0" y="686.0" font-size="12" fill="#2b2b2b" font-weight="normal" text-anchor="start">his own verdict: data insufficient.</text>
<text x="32.0" y="702.0" font-size="12" fill="#2b2b2b" font-weight="normal" text-anchor="start">→ partly ruled out</text>
<rect x="324.0" y="544" width="288.0" height="184" rx="6" fill="#ffffff" stroke="#284b63" stroke-width="1.2"/>
<text x="336.0" y="568.0" font-size="14" fill="#284b63" font-weight="bold" text-anchor="start">Told afterwards · memory (L·D)</text>
<text x="336.0" y="590.0" font-size="12" fill="#2b2b2b" font-weight="normal" text-anchor="start">First record Nov 1994, 3+ years later.</text>
<text x="336.0" y="606.0" font-size="12" fill="#2b2b2b" font-weight="normal" text-anchor="start">Staff explain operations to patients;</text>
<text x="336.0" y="622.0" font-size="12" fill="#2b2b2b" font-weight="normal" text-anchor="start">no source read asks what she was told.</text>
<text x="336.0" y="638.0" font-size="12" fill="#2b2b2b" font-weight="normal" text-anchor="start">The saw was described with a groove</text>
<text x="336.0" y="654.0" font-size="12" fill="#2b2b2b" font-weight="normal" text-anchor="start">it does not have.</text>
<text x="336.0" y="670.0" font-size="12" fill="#2b2b2b" font-weight="normal" text-anchor="start">→ L partly ruled out, D not ruled out</text>
<rect x="628.0" y="544" width="288.0" height="184" rx="6" fill="#ffffff" stroke="#284b63" stroke-width="1.2"/>
<text x="640.0" y="568.0" font-size="14" fill="#284b63" font-weight="bold" text-anchor="start">Timing (the central point)</text>
<text x="640.0" y="590.0" font-size="12" fill="#2b2b2b" font-weight="normal" text-anchor="start">Operative record: silent brain from</text>
<text x="640.0" y="606.0" font-size="12" fill="#2b2b2b" font-weight="normal" text-anchor="start">11:10/11:24, standstill 11:25–11:30.</text>
<text x="640.0" y="622.0" font-size="12" fill="#2b2b2b" font-weight="normal" text-anchor="start">Every checked perception lies outside</text>
<text x="640.0" y="638.0" font-size="12" fill="#2b2b2b" font-weight="normal" text-anchor="start">that window. The tunnel, light and</text>
<text x="640.0" y="654.0" font-size="12" fill="#2b2b2b" font-weight="normal" text-anchor="start">relatives carry no time at all.</text>
<text x="640.0" y="670.0" font-size="12" fill="#2b2b2b" font-weight="normal" text-anchor="start">Sabom himself: "tantalizing clues but</text>
<text x="640.0" y="686.0" font-size="12" fill="#2b2b2b" font-weight="normal" text-anchor="start">no definite answers".</text>
<rect x="932.0" y="544" width="288.0" height="184" rx="6" fill="#fbf1ea" stroke="#b5541c" stroke-width="2"/>
<text x="944.0" y="568.0" font-size="14" fill="#b5541c" font-weight="bold" text-anchor="start">Grades</text>
<text x="944.0" y="590.0" font-size="12" fill="#2b2b2b" font-weight="normal" text-anchor="start">Source: investigator's interview +</text>
<text x="944.0" y="606.0" font-size="12" fill="#2b2b2b" font-weight="normal" text-anchor="start">record extracts; book unopened (S7=1)</text>
<text x="944.0" y="622.0" font-size="12" fill="#2b2b2b" font-weight="normal" text-anchor="start">· one experiencer · 3 years · one</text>
<text x="944.0" y="638.0" font-size="12" fill="#2b2b2b" font-weight="normal" text-anchor="start">sympathetic investigator → R = C</text>
<text x="944.0" y="654.0" font-size="12" fill="#2b2b2b" font-weight="normal" text-anchor="start">Verified items, but no record before</text>
<text x="944.0" y="670.0" font-size="12" fill="#2b2b2b" font-weight="normal" text-anchor="start">checking and no leak-proof document</text>
<text x="944.0" y="686.0" font-size="12" fill="#2b2b2b" font-weight="normal" text-anchor="start">→ V = V1 · counted in both layers (S at I0)</text>
<text x="20.0" y="748.0" font-size="11" fill="#6b6b6b" font-weight="normal" text-anchor="start">Diagram · drawn by William (2026-10-25) · not a record · generating code tools/diagrams/NDE-US-1991-reynolds.py en</text>
</svg>
