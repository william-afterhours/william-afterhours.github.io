<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="680" viewBox="0 0 1240 680" font-family="'Helvetica Neue',Helvetica,Arial,'Noto Sans',sans-serif">
<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#6b6b6b"/></marker></defs>
<rect width="1240" height="680" fill="#faf8f8"/>
<text x="20" y="34" font-size="20" fill="#2b2b2b" font-weight="bold" text-anchor="start">The dentures case, Netherlands 1979 — sequence of events and where the verified information sits</text>
<text x="20" y="56" font-size="12" fill="#6b6b6b" font-weight="normal" text-anchor="start">Facts from §3, §6 and §7 of card NDE-NL-1979-dentures only. Details differ between versions; source numbers are in the card.</text>
<rect x="20" y="80" width="185" height="172" rx="6" fill="#ffffff" stroke="#284b63" stroke-width="1.2"/>
<text x="32" y="104" font-size="14" fill="#284b63" font-weight="bold" text-anchor="start">1 Found</text>
<text x="32" y="126" font-size="11.5" fill="#2b2b2b" font-weight="normal" text-anchor="start">Late 1979, a cold night.</text>
<text x="32" y="143" font-size="11.5" fill="#2b2b2b" font-weight="normal" text-anchor="start">B., a man in his 40s, lying</text>
<text x="32" y="160" font-size="11.5" fill="#2b2b2b" font-weight="normal" text-anchor="start">in a meadow at Ooij.</text>
<text x="32" y="177" font-size="11.5" fill="#2b2b2b" font-weight="normal" text-anchor="start">No pulse, no breathing,</text>
<text x="32" y="194" font-size="11.5" fill="#2b2b2b" font-weight="normal" text-anchor="start">ventricular fibrillation.</text>
<text x="32" y="211" font-size="11.5" fill="#2b2b2b" font-weight="normal" text-anchor="start">Time on the ground unknown.</text>
<line x1="205" y1="166.0" x2="217" y2="166.0" stroke="#6b6b6b" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="223" y="80" width="185" height="172" rx="6" fill="#ffffff" stroke="#284b63" stroke-width="1.2"/>
<text x="235" y="104" font-size="14" fill="#284b63" font-weight="bold" text-anchor="start">2 Transfer</text>
<text x="235" y="126" font-size="11.5" fill="#2b2b2b" font-weight="normal" text-anchor="start">Ambulance crew begin CPR;</text>
<text x="235" y="143" font-size="11.5" fill="#2b2b2b" font-weight="normal" text-anchor="start">within 30 min to the CCU</text>
<text x="235" y="160" font-size="11.5" fill="#2b2b2b" font-weight="normal" text-anchor="start">resuscitation room of the</text>
<text x="235" y="177" font-size="11.5" fill="#2b2b2b" font-weight="normal" text-anchor="start">Canisius Hospital, Nijmegen.</text>
<text x="235" y="194" font-size="11.5" fill="#2b2b2b" font-weight="normal" text-anchor="start">Bluish patches, ice-cold</text>
<text x="235" y="211" font-size="11.5" fill="#2b2b2b" font-weight="normal" text-anchor="start">body, pupils unreactive.</text>
<line x1="408" y1="166.0" x2="420" y2="166.0" stroke="#6b6b6b" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="426" y="80" width="185" height="172" rx="6" fill="#fbf1ea" stroke="#b5541c" stroke-width="2"/>
<text x="438" y="104" font-size="14" fill="#b5541c" font-weight="bold" text-anchor="start">3 Dentures</text>
<text x="438" y="126" font-size="11.5" fill="#2b2b2b" font-weight="normal" text-anchor="start">Dentures found on trying</text>
<text x="438" y="143" font-size="11.5" fill="#2b2b2b" font-weight="normal" text-anchor="start">to intubate. Nurse T.G.</text>
<text x="438" y="160" font-size="11.5" fill="#2b2b2b" font-weight="normal" text-anchor="start">removes them, puts them on</text>
<text x="438" y="177" font-size="11.5" fill="#2b2b2b" font-weight="normal" text-anchor="start">the crash cart's already</text>
<text x="438" y="194" font-size="11.5" fill="#2b2b2b" font-weight="normal" text-anchor="start">extended wooden shelf.</text>
<text x="438" y="211" font-size="11.5" fill="#2b2b2b" font-weight="normal" text-anchor="start">(Circulation at that moment:</text>
<text x="438" y="228" font-size="11.5" fill="#2b2b2b" font-weight="normal" text-anchor="start">versions differ)</text>
<line x1="611" y1="166.0" x2="623" y2="166.0" stroke="#6b6b6b" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="629" y="80" width="185" height="172" rx="6" fill="#ffffff" stroke="#284b63" stroke-width="1.2"/>
<text x="641" y="104" font-size="14" fill="#284b63" font-weight="bold" text-anchor="start">4 Resuscitation</text>
<text x="641" y="126" font-size="11.5" fill="#2b2b2b" font-weight="normal" text-anchor="start">Over an hour. Manual and</text>
<text x="641" y="143" font-size="11.5" fill="#2b2b2b" font-weight="normal" text-anchor="start">mechanical massage, five</text>
<text x="641" y="160" font-size="11.5" fill="#2b2b2b" font-weight="normal" text-anchor="start">shocks. After ~15 min the</text>
<text x="641" y="177" font-size="11.5" fill="#2b2b2b" font-weight="normal" text-anchor="start">team exchange looks about</text>
<text x="641" y="194" font-size="11.5" fill="#2b2b2b" font-weight="normal" text-anchor="start">stopping. Eyes closed.</text>
<text x="641" y="211" font-size="11.5" fill="#2b2b2b" font-weight="normal" text-anchor="start">→ ICU for several days.</text>
<line x1="814" y1="166.0" x2="826" y2="166.0" stroke="#6b6b6b" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="832" y="80" width="185" height="172" rx="6" fill="#ffffff" stroke="#284b63" stroke-width="1.2"/>
<text x="844" y="104" font-size="14" fill="#284b63" font-weight="bold" text-anchor="start">5 Reunion</text>
<text x="844" y="126" font-size="11.5" fill="#2b2b2b" font-weight="normal" text-anchor="start">1+ week later, rehab ward.</text>
<text x="844" y="143" font-size="11.5" fill="#2b2b2b" font-weight="normal" text-anchor="start">B. on seeing T.G.: "you took</text>
<text x="844" y="160" font-size="11.5" fill="#2b2b2b" font-weight="normal" text-anchor="start">my dentures out and put</text>
<text x="844" y="177" font-size="11.5" fill="#2b2b2b" font-weight="normal" text-anchor="start">them on that cart's shelf".</text>
<text x="844" y="194" font-size="11.5" fill="#2b2b2b" font-weight="normal" text-anchor="start">Describes the room layout</text>
<text x="844" y="211" font-size="11.5" fill="#2b2b2b" font-weight="normal" text-anchor="start">and the team's appearance.</text>
<line x1="1017" y1="166.0" x2="1029" y2="166.0" stroke="#6b6b6b" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="1035" y="80" width="185" height="172" rx="6" fill="#ffffff" stroke="#284b63" stroke-width="1.2"/>
<text x="1047" y="104" font-size="14" fill="#284b63" font-weight="bold" text-anchor="start">6 Record</text>
<text x="1047" y="126" font-size="11.5" fill="#2b2b2b" font-weight="normal" text-anchor="start">1991 nursing journal</text>
<text x="1047" y="143" font-size="11.5" fill="#2b2b2b" font-weight="normal" text-anchor="start">Cordiaal (hearsay, brief)</text>
<text x="1047" y="160" font-size="11.5" fill="#2b2b2b" font-weight="normal" text-anchor="start">1994 Merkawah interview,</text>
<text x="1047" y="177" font-size="11.5" fill="#2b2b2b" font-weight="normal" text-anchor="start">12 pp. (first full record)</text>
<text x="1047" y="194" font-size="11.5" fill="#2b2b2b" font-weight="normal" text-anchor="start">2001 Lancet summary</text>
<text x="1047" y="211" font-size="11.5" fill="#2b2b2b" font-weight="normal" text-anchor="start">2008 re-interview = 1994</text>
<path d="M518.5,252 v22" stroke="#b5541c" stroke-width="1.5"/>
<rect x="326" y="274" width="385" height="46" rx="6" fill="#b5541c"/>
<text x="518.5" y="293" font-size="13" fill="#ffffff" font-weight="bold" text-anchor="middle">The moment the verified information was created</text>
<text x="518.5" y="311" font-size="11.5" fill="#ffffff" font-weight="normal" text-anchor="middle">B. recorded as unconscious · eyes closed · pupils unreactive</text>
<text x="20" y="344" font-size="14" fill="#284b63" font-weight="bold" text-anchor="start">What B. said that was confirmed (§6)</text>
<rect x="20" y="356" width="1200" height="78" rx="6" fill="#eef2f5" stroke="#284b63" stroke-width="0.8"/>
<text x="32.0" y="384" font-size="11.5" fill="#2b2b2b" font-weight="bold" text-anchor="start">It was T.G. who removed the dentures</text>
<text x="32.0" y="404" font-size="11.5" fill="#6b6b6b" font-weight="normal" text-anchor="start">T.G. had not seen B. for 1+ week</text>
<text x="332.0" y="384" font-size="11.5" fill="#2b2b2b" font-weight="bold" text-anchor="start">Where put: wooden shelf, bottles on top</text>
<text x="332.0" y="404" font-size="11.5" fill="#6b6b6b" font-weight="normal" text-anchor="start">Cart unique to that room and hospital</text>
<text x="632.0" y="384" font-size="11.5" fill="#2b2b2b" font-weight="bold" text-anchor="start">Room layout (basin, mirror, cart, cabinet)</text>
<text x="632.0" y="404" font-size="11.5" fill="#6b6b6b" font-weight="normal" text-anchor="start">B.'s first admission to this hospital</text>
<text x="932.0" y="384" font-size="11.5" fill="#2b2b2b" font-weight="bold" text-anchor="start">Team's looks · talk of stopping · the massage</text>
<text x="932.0" y="404" font-size="11.5" fill="#6b6b6b" font-weight="normal" text-anchor="start">Partly explicable by hearing</text>
<text x="1210" y="426" font-size="11" fill="#6b6b6b" font-weight="normal" text-anchor="end">All known to the resuscitation team at the time → cannot separate psi (H2) from survival (H1)</text>
<text x="20" y="462" font-size="14" fill="#284b63" font-weight="bold" text-anchor="start">Other ways to explain it (§7) — hence the grades C / V1</text>
<rect x="20.0" y="474" width="288.0" height="150" rx="6" fill="#ffffff" stroke="#284b63" stroke-width="1.2"/>
<text x="32.0" y="498" font-size="14" fill="#284b63" font-weight="bold" text-anchor="start">Reconstructed from hearing (N)</text>
<text x="32.0" y="520" font-size="12" fill="#2b2b2b" font-weight="normal" text-anchor="start">Some consciousness through CPR</text>
<text x="32.0" y="536" font-size="12" fill="#2b2b2b" font-weight="normal" text-anchor="start">perfusion; scene pieced together</text>
<text x="32.0" y="552" font-size="12" fill="#2b2b2b" font-weight="normal" text-anchor="start">from sound (Woerlee 2004, 2010).</text>
<text x="32.0" y="568" font-size="12" fill="#2b2b2b" font-weight="normal" text-anchor="start">↔ Shelf's look and team's faces</text>
<text x="32.0" y="584" font-size="12" fill="#2b2b2b" font-weight="normal" text-anchor="start">not explained by sound; the cart</text>
<text x="32.0" y="600" font-size="12" fill="#2b2b2b" font-weight="normal" text-anchor="start">unique (Smit &amp; Rivas 2010).</text>
<text x="32.0" y="616" font-size="12" fill="#2b2b2b" font-weight="normal" text-anchor="start">→ partly ruled out</text>
<rect x="324.0" y="474" width="288.0" height="150" rx="6" fill="#ffffff" stroke="#284b63" stroke-width="1.2"/>
<text x="336.0" y="498" font-size="14" fill="#284b63" font-weight="bold" text-anchor="start">Leakage (L)</text>
<text x="336.0" y="520" font-size="12" fill="#2b2b2b" font-weight="normal" text-anchor="start">During 1+ week in the ICU, staff</text>
<text x="336.0" y="536" font-size="12" fill="#2b2b2b" font-weight="normal" text-anchor="start">may have mentioned the dentures.</text>
<text x="336.0" y="552" font-size="12" fill="#2b2b2b" font-weight="normal" text-anchor="start">No investigator asked about</text>
<text x="336.0" y="568" font-size="12" fill="#2b2b2b" font-weight="normal" text-anchor="start">this route.</text>
<text x="336.0" y="584" font-size="12" fill="#2b2b2b" font-weight="normal" text-anchor="start">→ not ruled out</text>
<rect x="628.0" y="474" width="288.0" height="150" rx="6" fill="#ffffff" stroke="#284b63" stroke-width="1.2"/>
<text x="640.0" y="498" font-size="14" fill="#284b63" font-weight="bold" text-anchor="start">Memory, single witness (D·X)</text>
<text x="640.0" y="520" font-size="12" fill="#2b2b2b" font-weight="normal" text-anchor="start">First full record 12 years after</text>
<text x="640.0" y="536" font-size="12" fill="#2b2b2b" font-weight="normal" text-anchor="start">the event. One witness, T.G.</text>
<text x="640.0" y="552" font-size="12" fill="#2b2b2b" font-weight="normal" text-anchor="start">Details differ by version (upper</text>
<text x="640.0" y="568" font-size="12" fill="#2b2b2b" font-weight="normal" text-anchor="start">vs upper+lower dentures; whether</text>
<text x="640.0" y="584" font-size="12" fill="#2b2b2b" font-weight="normal" text-anchor="start">circulation). 1994↔2008 agree.</text>
<text x="640.0" y="600" font-size="12" fill="#2b2b2b" font-weight="normal" text-anchor="start">→ not ruled out</text>
<rect x="932.0" y="474" width="288.0" height="150" rx="6" fill="#fbf1ea" stroke="#b5541c" stroke-width="2"/>
<text x="944.0" y="498" font-size="14" fill="#b5541c" font-weight="bold" text-anchor="start">Grades</text>
<text x="944.0" y="520" font-size="12" fill="#2b2b2b" font-weight="normal" text-anchor="start">Source secondary (interview</text>
<text x="944.0" y="536" font-size="12" fill="#2b2b2b" font-weight="normal" text-anchor="start">record) · single witness ·</text>
<text x="944.0" y="552" font-size="12" fill="#2b2b2b" font-weight="normal" text-anchor="start">recalled after 12 years ·</text>
<text x="944.0" y="568" font-size="12" fill="#2b2b2b" font-weight="normal" text-anchor="start">one investigating body → R = C</text>
<text x="944.0" y="584" font-size="12" fill="#2b2b2b" font-weight="normal" text-anchor="start">Verified info, but no record</text>
<text x="944.0" y="600" font-size="12" fill="#2b2b2b" font-weight="normal" text-anchor="start">before checking → V = V1</text>
<text x="944.0" y="616" font-size="12" fill="#2b2b2b" font-weight="normal" text-anchor="start">Counted: V layer only</text>
<text x="20" y="664" font-size="11" fill="#6b6b6b" font-weight="normal" text-anchor="start">Diagram · drawn by William (2026-10-23) · not a record · generating code tools/diagrams/NDE-NL-1979-dentures.py en</text>
</svg>
