<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="600" viewBox="0 0 1240 600" font-family="'Helvetica Neue',Helvetica,Arial,'Noto Sans',sans-serif">
<rect width="1240" height="600" fill="#faf8f8"/>
<text x="40" y="38" font-size="19" font-weight="700" fill="#2b2b2b">Daisy Dryden, San Jose 1864 — the deathbed, the mother's notes, the memoir of 1894 and its road into print</text>
<text x="40" y="60" font-size="11.5" fill="#6b6b6b">Facts from §3 and §4 of card DBV-US-1864-dryden (the memoir, 3rd edition 1909; its reprint in JASPR, June 1918; the father's book of 1872). This is a</text>
<text x="40" y="75" font-size="11.5" fill="#6b6b6b">diagram by William, not a record.</text>
<rect x="40" y="102" width="76" height="118" rx="4" fill="#284b63"/>
<text x="78.0" y="166.0" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">THE EVENT</text>
<rect x="126" y="102" width="258" height="118" rx="6" fill="#eef2f5" stroke="#284b63" stroke-width="1"/>
<text x="136" y="122" font-size="12.5" font-weight="700" fill="#b5541c">early 1864</text>
<text x="136" y="140" font-size="12" fill="#2b2b2b">Her brother David Albion</text>
<text x="136" y="156" font-size="12" fill="#2b2b2b">('Allie') dies of scarlet</text>
<text x="136" y="172" font-size="12" fill="#2b2b2b">fever, aged six, about seven</text>
<text x="136" y="188" font-size="12" fill="#2b2b2b">months before her death</text>
<path d="M386,161.0 L395,161.0" stroke="#284b63" stroke-width="1.5"/>
<path d="M391,157.0 L396,161.0 L391,165.0" fill="none" stroke="#284b63" stroke-width="1.5"/>
<rect x="398" y="102" width="258" height="118" rx="6" fill="#eef2f5" stroke="#284b63" stroke-width="1"/>
<text x="408" y="122" font-size="12.5" font-weight="700" fill="#b5541c">summer 1864</text>
<text x="408" y="140" font-size="12" fill="#2b2b2b">Daisy, aged nine, has bilious</text>
<text x="408" y="156" font-size="12" fill="#2b2b2b">fever, then typhoid (five</text>
<text x="408" y="172" font-size="12" fill="#2b2b2b">weeks); seems to recover</text>
<path d="M658,161.0 L667,161.0" stroke="#284b63" stroke-width="1.5"/>
<path d="M663,157.0 L668,161.0 L663,165.0" fill="none" stroke="#284b63" stroke-width="1.5"/>
<rect x="670" y="102" width="258" height="118" rx="6" fill="#eef2f5" stroke="#284b63" stroke-width="1"/>
<text x="680" y="122" font-size="12.5" font-weight="700" fill="#b5541c">last 3–4 days</text>
<text x="680" y="140" font-size="12" fill="#2b2b2b">Enteritis. She says Allie is</text>
<text x="680" y="156" font-size="12" fill="#2b2b2b">with her, answers questions</text>
<text x="680" y="172" font-size="12" fill="#2b2b2b">'when Allie comes'; describes</text>
<text x="680" y="188" font-size="12" fill="#2b2b2b">other dead people to visitors</text>
<path d="M930,161.0 L939,161.0" stroke="#284b63" stroke-width="1.5"/>
<path d="M935,157.0 L940,161.0 L935,165.0" fill="none" stroke="#284b63" stroke-width="1.5"/>
<rect x="942" y="102" width="258" height="118" rx="6" fill="#eef2f5" stroke="#284b63" stroke-width="1"/>
<text x="952" y="122" font-size="12.5" font-weight="700" fill="#b5541c">8 Oct 1864, 11.30 p.m.</text>
<text x="952" y="140" font-size="12" fill="#2b2b2b">'Allie has come for me' (11.15);</text>
<text x="952" y="156" font-size="12" fill="#2b2b2b">at the hour she had named,</text>
<text x="952" y="172" font-size="12" fill="#2b2b2b">'Come, Allie' — dies in her</text>
<text x="952" y="188" font-size="12" fill="#2b2b2b">father's arms. Mother present</text>
<path d="M1071.0,220 L1071.0,228.0 L255.0,228.0 L255.0,233" fill="none" stroke="#284b63" stroke-width="1.2" stroke-dasharray="4,3"/>
<path d="M251.0,228 L255.0,234 L259.0,228" fill="none" stroke="#284b63" stroke-width="1.2"/>
<rect x="40" y="236" width="76" height="118" rx="4" fill="#284b63"/>
<text x="78.0" y="300.0" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">THE RECORD</text>
<rect x="126" y="236" width="258" height="118" rx="6" fill="#fbf1ea" stroke="#284b63" stroke-width="1"/>
<text x="136" y="256" font-size="12.5" font-weight="700" fill="#b5541c">'a short time after'</text>
<text x="136" y="274" font-size="12" fill="#2b2b2b">The mother writes the dying</text>
<text x="136" y="290" font-size="12" fill="#2b2b2b">words in her notebook.</text>
<text x="136" y="306" font-size="12" fill="#2b2b2b">Notes not seen; known only</text>
<text x="136" y="322" font-size="12" fill="#2b2b2b">from her own preface</text>
<path d="M386,295.0 L395,295.0" stroke="#284b63" stroke-width="1.5"/>
<path d="M391,291.0 L396,295.0 L391,299.0" fill="none" stroke="#284b63" stroke-width="1.5"/>
<rect x="398" y="236" width="258" height="118" rx="6" fill="#fbf1ea" stroke="#284b63" stroke-width="1"/>
<text x="408" y="256" font-size="12.5" font-weight="700" fill="#b5541c">1872</text>
<text x="408" y="274" font-size="12" fill="#2b2b2b">The father, Rev. D. A. Dryden,</text>
<text x="408" y="290" font-size="12" fill="#2b2b2b">publishes They Rise: the dead</text>
<text x="408" y="306" font-size="12" fill="#2b2b2b">have a spiritual body at once.</text>
<text x="408" y="322" font-size="12" fill="#2b2b2b">Daisy is not mentioned</text>
<path d="M658,295.0 L667,295.0" stroke="#284b63" stroke-width="1.5"/>
<path d="M663,291.0 L668,295.0 L663,299.0" fill="none" stroke="#284b63" stroke-width="1.5"/>
<rect x="670" y="236" width="258" height="118" rx="6" fill="#fbf1ea" stroke="#284b63" stroke-width="1"/>
<text x="680" y="256" font-size="12.5" font-weight="700" fill="#b5541c">Oct 1894 · 30 years later</text>
<text x="680" y="274" font-size="12" fill="#2b2b2b">The mother, now a widow at</text>
<text x="680" y="290" font-size="12" fill="#2b2b2b">Gilroy, writes the memoir</text>
<text x="680" y="306" font-size="12" fill="#2b2b2b">'principally' from the notes;</text>
<text x="680" y="322" font-size="12" fill="#2b2b2b">dates her preface</text>
<path d="M930,295.0 L939,295.0" stroke="#284b63" stroke-width="1.5"/>
<path d="M935,291.0 L940,295.0 L935,299.0" fill="none" stroke="#284b63" stroke-width="1.5"/>
<rect x="942" y="236" width="258" height="118" rx="6" fill="#fbf1ea" stroke="#284b63" stroke-width="1"/>
<text x="952" y="256" font-size="12.5" font-weight="700" fill="#b5541c">c. 1901</text>
<text x="952" y="274" font-size="12" fill="#2b2b2b">The mother dies before</text>
<text x="952" y="290" font-size="12" fill="#2b2b2b">the memoir is printed</text>
<text x="952" y="306" font-size="12" fill="#2b2b2b">(Higgins 1906; Hyslop 1918)</text>
<path d="M1071.0,354 L1071.0,362.0 L255.0,362.0 L255.0,367" fill="none" stroke="#284b63" stroke-width="1.2" stroke-dasharray="4,3"/>
<path d="M251.0,362 L255.0,368 L259.0,362" fill="none" stroke="#284b63" stroke-width="1.2"/>
<rect x="40" y="370" width="76" height="118" rx="4" fill="#284b63"/>
<text x="78.0" y="434.0" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">INTO PRINT</text>
<rect x="126" y="370" width="258" height="118" rx="6" fill="#e4ebe4" stroke="#284b63" stroke-width="1"/>
<text x="136" y="390" font-size="12.5" font-weight="700" fill="#b5541c">1905</text>
<text x="136" y="408" font-size="12" fill="#2b2b2b">First edition, Toronto:</text>
<text x="136" y="424" font-size="12" fill="#2b2b2b">W. Briggs, 58 pp.; copyright</text>
<text x="136" y="440" font-size="12" fill="#2b2b2b">entered in Canada by</text>
<text x="136" y="456" font-size="12" fill="#2b2b2b">Rev. F. L. Higgins</text>
<path d="M386,429.0 L395,429.0" stroke="#284b63" stroke-width="1.5"/>
<path d="M391,425.0 L396,429.0 L391,433.0" fill="none" stroke="#284b63" stroke-width="1.5"/>
<rect x="398" y="370" width="258" height="118" rx="6" fill="#e4ebe4" stroke="#284b63" stroke-width="1"/>
<text x="408" y="390" font-size="12.5" font-weight="700" fill="#b5541c">1909</text>
<text x="408" y="408" font-size="12" fill="#2b2b2b">Third edition, Boston: Colonial</text>
<text x="408" y="424" font-size="12" fill="#2b2b2b">Press, Higgins's introduction</text>
<text x="408" y="440" font-size="12" fill="#2b2b2b">of 1906. A copy reaches</text>
<text x="408" y="456" font-size="12" fill="#2b2b2b">William James's library</text>
<path d="M658,429.0 L667,429.0" stroke="#284b63" stroke-width="1.5"/>
<path d="M663,425.0 L668,429.0 L663,433.0" fill="none" stroke="#284b63" stroke-width="1.5"/>
<rect x="670" y="370" width="258" height="118" rx="6" fill="#e4ebe4" stroke="#284b63" stroke-width="1"/>
<text x="680" y="390" font-size="12.5" font-weight="700" fill="#b5541c">June 1918</text>
<text x="680" y="408" font-size="12" fill="#2b2b2b">Hyslop reprints the memoir</text>
<text x="680" y="424" font-size="12" fill="#2b2b2b">in JASPR 12(6) pp. 375–391,</text>
<text x="680" y="440" font-size="12" fill="#2b2b2b">with the living sister's</text>
<text x="680" y="456" font-size="12" fill="#2b2b2b">permission</text>
<path d="M930,429.0 L939,429.0" stroke="#284b63" stroke-width="1.5"/>
<path d="M935,425.0 L940,429.0 L935,433.0" fill="none" stroke="#284b63" stroke-width="1.5"/>
<rect x="942" y="370" width="258" height="118" rx="6" fill="#e4ebe4" stroke="#284b63" stroke-width="1"/>
<text x="952" y="390" font-size="12.5" font-weight="700" fill="#b5541c">Oct 1918 →</text>
<text x="952" y="408" font-size="12" fill="#2b2b2b">Hyslop compares later cases</text>
<text x="952" y="424" font-size="12" fill="#2b2b2b">with 'that of Daisy Dryden';</text>
<text x="952" y="440" font-size="12" fill="#2b2b2b">Barrett 1926 reprints it</text>
<text x="952" y="456" font-size="12" fill="#2b2b2b">in chapter III</text>
<rect x="40" y="514" width="1160" height="66" rx="6" fill="#ffffff" stroke="#b5541c" stroke-width="1"/>
<text x="52" y="534" font-size="12" fill="#2b2b2b">Grades: S1 1 (a witness's memoir from notes made at the time; the notes not seen) · S2 1 (one named witness who was present: the mother) · S3 0 (30 years to the</text>
<text x="52" y="550" font-size="12" fill="#2b2b2b">dated record) · S4 0 · S6 1 (no investigator; Hyslop reprinted 54 years later) · S7 2 → 3/10 → R C, no cap · V0 (claims about dead people the child is said not to</text>
<text x="52" y="566" font-size="12" fill="#2b2b2b">have known; recorded only after) · independence I2</text>
</svg>
