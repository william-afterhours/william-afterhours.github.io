<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="920" viewBox="0 0 1240 920" font-family="'Helvetica Neue',Helvetica,Arial,'Noto Sans',sans-serif">
<rect width="1240" height="920" fill="#faf8f8"/>
<text x="20" y="34" font-size="20" fill="#2b2b2b" font-weight="bold" text-anchor="start">The 'Doris' deathbed vision, London 1924 — timeline, who heard which words, chain of records</text>
<text x="20" y="56" font-size="12" fill="#6b6b6b" font-weight="normal" text-anchor="start">Facts from §3, §4 and §6 of card DBV-GB-1924-doris only. Dates from the statements reprinted in Barrett 1926 and the GRO index (FreeBMD). Source numbers are in the card.</text>
<text x="20" y="80" font-size="14" fill="#284b63" font-weight="bold" text-anchor="start">1. Timeline</text>
<line x1="40" y1="200" x2="1200" y2="200" stroke="#284b63" stroke-width="2"/>
<circle cx="60.0" cy="200" r="5" fill="#284b63"/>
<text x="60.0" y="186" font-size="12.5" fill="#284b63" font-weight="bold" text-anchor="middle">Apr–Jun 1923</text>
<text x="20" y="102" font-size="11.5" fill="#2b2b2b" font-weight="normal" text-anchor="start">Marriage (Shoreditch)</text>
<text x="20" y="117" font-size="11.5" fill="#2b2b2b" font-weight="normal" text-anchor="start">GRO index Q2 1923</text>
<circle cx="239.20000000000002" cy="200" r="5" fill="#284b63"/>
<text x="239.20000000000002" y="224" font-size="12.5" fill="#284b63" font-weight="bold" text-anchor="middle">1923-12-25</text>
<text x="153.20000000000002" y="258" font-size="11.5" fill="#2b2b2b" font-weight="normal" text-anchor="start">Sister Vida (34) dies</text>
<text x="153.20000000000002" y="273" font-size="11.5" fill="#2b2b2b" font-weight="normal" text-anchor="start">West Ham · index Q4 1923</text>
<text x="153.20000000000002" y="288" font-size="11.5" fill="#2b2b2b" font-weight="normal" text-anchor="start">Doris already gravely ill</text>
<circle cx="396.0" cy="200" r="5" fill="#284b63"/>
<text x="396.0" y="186" font-size="12.5" fill="#284b63" font-weight="bold" text-anchor="middle">late Dec – Jan</text>
<text x="310.0" y="102" font-size="11.5" fill="#2b2b2b" font-weight="normal" text-anchor="start">Family conceal the death:</text>
<text x="310.0" y="117" font-size="11.5" fill="#2b2b2b" font-weight="normal" text-anchor="start">visits without mourning,</text>
<text x="310.0" y="132" font-size="11.5" fill="#2b2b2b" font-weight="normal" text-anchor="start">husband reads letters first</text>
<circle cx="586.4" cy="200" r="7" fill="#b5541c"/>
<text x="586.4" y="224" font-size="12.5" fill="#b5541c" font-weight="bold" text-anchor="middle">1924-01-12</text>
<text x="500.4" y="258" font-size="11.5" fill="#2b2b2b" font-weight="normal" text-anchor="start">Birth (premature) → vision → death</text>
<text x="500.4" y="273" font-size="11.5" fill="#2b2b2b" font-weight="normal" text-anchor="start">Mothers' Hospital, Clapton</text>
<text x="500.4" y="288" font-size="11.5" fill="#2b2b2b" font-weight="normal" text-anchor="start">Index: death Q1 1924 Hackney (22)</text>
<text x="500.4" y="303" font-size="11.5" fill="#2b2b2b" font-weight="normal" text-anchor="start">birth Q1 1924 Hackney, mother Clark</text>
<circle cx="765.6" cy="200" r="5" fill="#284b63"/>
<text x="765.6" y="186" font-size="12.5" fill="#284b63" font-weight="bold" text-anchor="middle">Feb 1924</text>
<text x="679.6" y="102" font-size="11.5" fill="#2b2b2b" font-weight="normal" text-anchor="start">Parish magazine (All Saints,</text>
<text x="679.6" y="117" font-size="11.5" fill="#2b2b2b" font-weight="normal" text-anchor="start">Haggerston), Feb issue:</text>
<text x="679.6" y="132" font-size="11.5" fill="#2b2b2b" font-weight="normal" text-anchor="start">vicar's mention — unverified</text>
<circle cx="933.6" cy="200" r="5" fill="#284b63"/>
<text x="933.6" y="224" font-size="12.5" fill="#284b63" font-weight="bold" text-anchor="middle">1924–1925</text>
<text x="847.6" y="258" font-size="11.5" fill="#2b2b2b" font-weight="normal" text-anchor="start">Three signed statements:</text>
<text x="847.6" y="273" font-size="11.5" fill="#2b2b2b" font-weight="normal" text-anchor="start">Lady Barrett's note (soon after,</text>
<text x="847.6" y="288" font-size="11.5" fill="#2b2b2b" font-weight="normal" text-anchor="start">undated) · Matron Castle ·</text>
<text x="847.6" y="303" font-size="11.5" fill="#2b2b2b" font-weight="normal" text-anchor="start">mother Clark; via Phillips</text>
<circle cx="1090.4" cy="200" r="5" fill="#284b63"/>
<text x="1090.4" y="186" font-size="12.5" fill="#284b63" font-weight="bold" text-anchor="middle">1925 · 1926</text>
<text x="1004.4000000000001" y="102" font-size="11.5" fill="#2b2b2b" font-weight="normal" text-anchor="start">1925-05-21 Barrett dies</text>
<text x="1004.4000000000001" y="117" font-size="11.5" fill="#2b2b2b" font-weight="normal" text-anchor="start">1926 Death-bed Visions</text>
<text x="1004.4000000000001" y="132" font-size="11.5" fill="#2b2b2b" font-weight="normal" text-anchor="start">pp. 10–14 (Wellcome scan)</text>
<text x="1180" y="330" font-size="11.5" fill="#6b6b6b" font-weight="normal" text-anchor="end">2026-10-22 William checked the marriage, the two deaths and the birth against the GRO index (FreeBMD) — order matches the book</text>
<text x="20" y="360" font-size="14" fill="#284b63" font-weight="bold" text-anchor="start">2. On the ward, 1924-01-12 — who heard which words (intersection of the three statements)</text>
<rect x="20" y="374" width="1060" height="214" rx="6" fill="#ffffff" stroke="#284b63" stroke-width="1"/>
<text x="549.0" y="392" font-size="12" fill="#284b63" font-weight="bold" text-anchor="middle">Lady Barrett</text>
<text x="667.0" y="392" font-size="12" fill="#284b63" font-weight="bold" text-anchor="middle">Dr Phillips</text>
<text x="785.0" y="392" font-size="12" fill="#284b63" font-weight="bold" text-anchor="middle">Matron Castle</text>
<text x="903.0" y="392" font-size="12" fill="#284b63" font-weight="bold" text-anchor="middle">Mother (Clark)</text>
<text x="1021.0" y="392" font-size="12" fill="#284b63" font-weight="bold" text-anchor="middle">Husband W.</text>
<text x="30" y="416" font-size="12" fill="#2b2b2b" font-weight="normal" text-anchor="start">① "It's getting so dark … darker and darker"</text>
<text x="549.0" y="416" font-size="13" fill="#2b2b2b" font-weight="normal" text-anchor="middle">●</text>
<text x="667.0" y="416" font-size="13" fill="#2b2b2b" font-weight="normal" text-anchor="middle">●</text>
<text x="785.0" y="416" font-size="13" fill="#2b2b2b" font-weight="normal" text-anchor="middle">○</text>
<text x="903.0" y="416" font-size="13" fill="#2b2b2b" font-weight="normal" text-anchor="middle">·</text>
<text x="1021.0" y="416" font-size="13" fill="#2b2b2b" font-weight="normal" text-anchor="middle">·</text>
<text x="30" y="442" font-size="12" fill="#2b2b2b" font-weight="normal" text-anchor="start">② "Lovely brightness — wonderful beings"</text>
<text x="549.0" y="442" font-size="13" fill="#2b2b2b" font-weight="normal" text-anchor="middle">●</text>
<text x="667.0" y="442" font-size="13" fill="#2b2b2b" font-weight="normal" text-anchor="middle">●</text>
<text x="785.0" y="442" font-size="13" fill="#2b2b2b" font-weight="normal" text-anchor="middle">○</text>
<text x="903.0" y="442" font-size="13" fill="#2b2b2b" font-weight="normal" text-anchor="middle">·</text>
<text x="1021.0" y="442" font-size="13" fill="#2b2b2b" font-weight="normal" text-anchor="middle">·</text>
<text x="30" y="468" font-size="12" fill="#2b2b2b" font-weight="normal" text-anchor="start">③ "Why, it's Father! Oh, he's so glad I'm coming"</text>
<text x="549.0" y="468" font-size="13" fill="#2b2b2b" font-weight="normal" text-anchor="middle">●</text>
<text x="667.0" y="468" font-size="13" fill="#2b2b2b" font-weight="normal" text-anchor="middle">●</text>
<text x="785.0" y="468" font-size="13" fill="#2b2b2b" font-weight="normal" text-anchor="middle">○</text>
<text x="903.0" y="468" font-size="13" fill="#2b2b2b" font-weight="normal" text-anchor="middle">◐</text>
<text x="1021.0" y="468" font-size="13" fill="#2b2b2b" font-weight="normal" text-anchor="middle">·</text>
<text x="30" y="494" font-size="12" fill="#2b2b2b" font-weight="normal" text-anchor="start">④ "Do you think I ought to stay for baby's sake?"</text>
<text x="549.0" y="494" font-size="13" fill="#2b2b2b" font-weight="normal" text-anchor="middle">●</text>
<text x="667.0" y="494" font-size="13" fill="#2b2b2b" font-weight="normal" text-anchor="middle">●</text>
<text x="785.0" y="494" font-size="13" fill="#2b2b2b" font-weight="normal" text-anchor="middle">○</text>
<text x="903.0" y="494" font-size="13" fill="#2b2b2b" font-weight="normal" text-anchor="middle">◐</text>
<text x="1021.0" y="494" font-size="13" fill="#2b2b2b" font-weight="normal" text-anchor="middle">●</text>
<rect x="22" y="503" width="1056" height="26" fill="#fbf1ea"/>
<text x="30" y="520" font-size="12" fill="#b5541c" font-weight="bold" text-anchor="start">⑤ "Oh, why there's Vida" (looking towards the Matron)</text>
<text x="549.0" y="520" font-size="13" fill="#2b2b2b" font-weight="normal" text-anchor="middle">·</text>
<text x="667.0" y="520" font-size="13" fill="#2b2b2b" font-weight="normal" text-anchor="middle">·</text>
<text x="785.0" y="520" font-size="13" fill="#b5541c" font-weight="normal" text-anchor="middle">●</text>
<text x="903.0" y="520" font-size="13" fill="#b5541c" font-weight="normal" text-anchor="middle">●</text>
<text x="1021.0" y="520" font-size="13" fill="#b5541c" font-weight="normal" text-anchor="middle">●</text>
<rect x="22" y="529" width="1056" height="26" fill="#fbf1ea"/>
<text x="30" y="546" font-size="12" fill="#b5541c" font-weight="bold" text-anchor="start">⑥ "He has Vida with him" (to her mother, puzzled)</text>
<text x="549.0" y="546" font-size="13" fill="#2b2b2b" font-weight="normal" text-anchor="middle">·</text>
<text x="667.0" y="546" font-size="13" fill="#2b2b2b" font-weight="normal" text-anchor="middle">·</text>
<text x="785.0" y="546" font-size="13" fill="#2b2b2b" font-weight="normal" text-anchor="middle">○</text>
<text x="903.0" y="546" font-size="13" fill="#b5541c" font-weight="normal" text-anchor="middle">●</text>
<text x="1021.0" y="546" font-size="13" fill="#b5541c" font-weight="normal" text-anchor="middle">●</text>
<text x="30" y="572" font-size="12" fill="#2b2b2b" font-weight="normal" text-anchor="start">⑦ asked for "the man who married us"</text>
<text x="549.0" y="572" font-size="13" fill="#2b2b2b" font-weight="normal" text-anchor="middle">·</text>
<text x="667.0" y="572" font-size="13" fill="#2b2b2b" font-weight="normal" text-anchor="middle">·</text>
<text x="785.0" y="572" font-size="13" fill="#2b2b2b" font-weight="normal" text-anchor="middle">●</text>
<text x="903.0" y="572" font-size="13" fill="#2b2b2b" font-weight="normal" text-anchor="middle">●</text>
<text x="1021.0" y="572" font-size="13" fill="#2b2b2b" font-weight="normal" text-anchor="middle">●</text>
<text x="20" y="606" font-size="11.5" fill="#6b6b6b" font-weight="normal" text-anchor="start">● in that person's own signed statement   ○ recorded as present (not in own statement)   ◐ presence unknown   · absent</text>
<text x="20" y="624" font-size="11.5" fill="#6b6b6b" font-weight="normal" text-anchor="start">Lady Barrett left the ward after ④ and the Matron took over. ⑤ and ⑥ are the verified information (V): Vida's death had been kept from the patient.</text>
<text x="20" y="650" font-size="14" fill="#284b63" font-weight="bold" text-anchor="start">3. At the moment of ⑤ and ⑥, who knew that Vida was dead</text>
<rect x="20" y="662" width="1200" height="96" rx="6" fill="#eef2f5" stroke="#284b63" stroke-width="0.8"/>
<text x="32.0" y="690" font-size="12.5" fill="#2b2b2b" font-weight="bold" text-anchor="start">Mother (Clark)</text>
<text x="32.0" y="710" font-size="11.5" fill="#6b6b6b" font-weight="normal" text-anchor="start">Knew — led the concealment</text>
<text x="332.0" y="690" font-size="12.5" fill="#2b2b2b" font-weight="bold" text-anchor="start">Husband W.</text>
<text x="332.0" y="710" font-size="11.5" fill="#6b6b6b" font-weight="normal" text-anchor="start">Knew — read the letters first</text>
<text x="632.0" y="690" font-size="12.5" fill="#2b2b2b" font-weight="bold" text-anchor="start">Matron Castle</text>
<text x="632.0" y="710" font-size="11.5" fill="#6b6b6b" font-weight="normal" text-anchor="start">Knew of 'a sister's death' (advised</text>
<text x="632.0" y="725" font-size="11.5" fill="#6b6b6b" font-weight="normal" text-anchor="start">concealment); did not know the name Vida</text>
<text x="932.0" y="690" font-size="12.5" fill="#2b2b2b" font-weight="bold" text-anchor="start">Lady Barrett · Phillips</text>
<text x="932.0" y="710" font-size="11.5" fill="#6b6b6b" font-weight="normal" text-anchor="start">Did not know (Barrett) — but not present</text>
<text x="932.0" y="725" font-size="11.5" fill="#6b6b6b" font-weight="normal" text-anchor="start">at ⑤ and ⑥</text>
<text x="1210" y="750" font-size="11.5" fill="#6b6b6b" font-weight="normal" text-anchor="end">→ Information known to those at the bedside: cannot separate psi (H2) from survival (H1); leakage (L) is not blocked by a prior record</text>
<text x="20" y="780" font-size="14" fill="#284b63" font-weight="bold" text-anchor="start">4. Chain of records — what this card has read</text>
