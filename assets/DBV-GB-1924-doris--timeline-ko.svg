<text x="1004.4000000000001" y="117" font-size="11.5" fill="#2b2b2b" font-weight="normal" text-anchor="start">1926 『Death-bed Visions』</text>
<text x="1004.4000000000001" y="132" font-size="11.5" fill="#2b2b2b" font-weight="normal" text-anchor="start">pp. 10–14 (Wellcome 스캔)</text>
<text x="1180" y="330" font-size="11.5" fill="#6b6b6b" font-weight="normal" text-anchor="end">2026-10-22 William이 GRO 색인(FreeBMD)으로 혼인·사망 2건·출생을 대조 — 책의 순서와 일치</text>
<text x="20" y="360" font-size="14" fill="#284b63" font-weight="bold" text-anchor="start">2. 1924-01-12 병동에서 — 누가 어느 말을 들었나 (진술서 3통의 교집합)</text>
