<circle cx="60.0" cy="200" r="5" fill="#284b63"/>
<text x="60.0" y="186" font-size="12.5" fill="#284b63" font-weight="bold" text-anchor="middle">1923년 4~6월</text>
<text x="20" y="102" font-size="11.5" fill="#2b2b2b" font-weight="normal" text-anchor="start">혼인(Shoreditch)</text>
<text x="20" y="117" font-size="11.5" fill="#2b2b2b" font-weight="normal" text-anchor="start">GRO 색인 Q2 1923</text>
<circle cx="239.20000000000002" cy="200" r="5" fill="#284b63"/>
