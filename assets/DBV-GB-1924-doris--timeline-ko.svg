<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="920" viewBox="0 0 1240 920" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic','Noto Sans CJK KR',sans-serif">
<rect width="1240" height="920" fill="#faf8f8"/>
<text x="20" y="34" font-size="20" fill="#2b2b2b" font-weight="bold" text-anchor="start">1924년 런던 '도리스' 임종 환시 — 연표, 누가 어느 말을 들었나, 기록의 사슬</text>
<text x="20" y="56" font-size="12" fill="#6b6b6b" font-weight="normal" text-anchor="start">카드 DBV-GB-1924-doris 3·4·6절의 사실만 옮김. 날짜는 Barrett 1926에 전재된 진술서와 GRO 색인(FreeBMD)에서. 출처 번호는 카드에 있다.</text>
<text x="20" y="80" font-size="14" fill="#284b63" font-weight="bold" text-anchor="start">1. 연표</text>
