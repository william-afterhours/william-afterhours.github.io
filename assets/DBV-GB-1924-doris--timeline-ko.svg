<text x="153.20000000000002" y="258" font-size="11.5" fill="#2b2b2b" font-weight="normal" text-anchor="start">언니 비다(34) 사망</text>
<text x="153.20000000000002" y="273" font-size="11.5" fill="#2b2b2b" font-weight="normal" text-anchor="start">West Ham · 색인 Q4 1923</text>
<text x="153.20000000000002" y="288" font-size="11.5" fill="#2b2b2b" font-weight="normal" text-anchor="start">도리스는 이미 중병</text>
<circle cx="396.0" cy="200" r="5" fill="#284b63"/>
<text x="396.0" y="186" font-size="12.5" fill="#284b63" font-weight="bold" text-anchor="middle">12월 말~1월</text>
<text x="310.0" y="102" font-size="11.5" fill="#2b2b2b" font-weight="normal" text-anchor="start">가족의 숨김 조치:</text>
<text x="310.0" y="117" font-size="11.5" fill="#2b2b2b" font-weight="normal" text-anchor="start">상복 안 입고 방문,</text>
<text x="310.0" y="132" font-size="11.5" fill="#2b2b2b" font-weight="normal" text-anchor="start">편지는 남편이 먼저 검열</text>
<circle cx="586.4" cy="200" r="7" fill="#b5541c"/>
<text x="586.4" y="224" font-size="12.5" fill="#b5541c" font-weight="bold" text-anchor="middle">1924-01-12</text>
<text x="500.4" y="258" font-size="11.5" fill="#2b2b2b" font-weight="normal" text-anchor="start">출산(조산) → 환시 → 사망</text>
<text x="500.4" y="273" font-size="11.5" fill="#2b2b2b" font-weight="normal" text-anchor="start">Mothers' Hospital, Clapton</text>
<text x="500.4" y="288" font-size="11.5" fill="#2b2b2b" font-weight="normal" text-anchor="start">색인: 사망 Q1 1924 Hackney(22세)</text>
<text x="500.4" y="303" font-size="11.5" fill="#2b2b2b" font-weight="normal" text-anchor="start">출생 Q1 1924 Hackney, 모성 Clark</text>
<circle cx="765.6" cy="200" r="5" fill="#284b63"/>
<text x="765.6" y="186" font-size="12.5" fill="#284b63" font-weight="bold" text-anchor="middle">1924-02</text>
<text x="679.6" y="102" font-size="11.5" fill="#2b2b2b" font-weight="normal" text-anchor="start">교구지(All Saints,</text>
<text x="679.6" y="117" font-size="11.5" fill="#2b2b2b" font-weight="normal" text-anchor="start">Haggerston) 2월호에</text>
<text x="679.6" y="132" font-size="11.5" fill="#2b2b2b" font-weight="normal" text-anchor="start">목사가 언급 — 미확인</text>
<circle cx="933.6" cy="200" r="5" fill="#284b63"/>
<text x="933.6" y="224" font-size="12.5" fill="#284b63" font-weight="bold" text-anchor="middle">1924~1925</text>
<text x="847.6" y="258" font-size="11.5" fill="#2b2b2b" font-weight="normal" text-anchor="start">서명 진술서 3통:</text>
<text x="847.6" y="273" font-size="11.5" fill="#2b2b2b" font-weight="normal" text-anchor="start">Lady Barrett 메모(직후, 날짜 없음)</text>
<text x="847.6" y="288" font-size="11.5" fill="#2b2b2b" font-weight="normal" text-anchor="start">수간호사 Castle · 어머니 Clark</text>
<text x="847.6" y="303" font-size="11.5" fill="#2b2b2b" font-weight="normal" text-anchor="start">Phillips 경유 수집</text>
<circle cx="1090.4" cy="200" r="5" fill="#284b63"/>
<text x="1090.4" y="186" font-size="12.5" fill="#284b63" font-weight="bold" text-anchor="middle">1925 · 1926</text>
