<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="600" viewBox="0 0 1240 600" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic','Helvetica Neue',Arial,sans-serif">
<rect width="1240" height="600" fill="#faf8f8"/>
<text x="40" y="38" font-size="19" font-weight="700" fill="#2b2b2b">데이지 드라이든, 새너제이 1864 — 임종, 어머니의 메모, 1894년의 회고록, 그리고 활자에 이르는 길</text>
<text x="40" y="60" font-size="11.5" fill="#6b6b6b">카드 DBV-US-1864-dryden 3절·4절의 사실(회고록 1909년 제3판, 1918년 6월 JASPR 재수록, 아버지의 1872년 책). 윌리엄이 그린 도해이며</text>
<text x="40" y="75" font-size="11.5" fill="#6b6b6b">기록이 아니다.</text>
<rect x="40" y="102" width="76" height="118" rx="4" fill="#284b63"/>
<text x="78.0" y="166.0" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">사건</text>
<rect x="126" y="102" width="258" height="118" rx="6" fill="#eef2f5" stroke="#284b63" stroke-width="1"/>
<text x="136" y="122" font-size="12.5" font-weight="700" fill="#b5541c">1864년 초</text>
<text x="136" y="140" font-size="12" fill="#2b2b2b">남동생 데이비드 앨비언</text>
<text x="136" y="156" font-size="12" fill="#2b2b2b">('앨리')이 성홍열로 여섯 살에</text>
<text x="136" y="172" font-size="12" fill="#2b2b2b">사망. 데이지가 죽기</text>
<text x="136" y="188" font-size="12" fill="#2b2b2b">약 일곱 달 전</text>
<path d="M386,161.0 L395,161.0" stroke="#284b63" stroke-width="1.5"/>
<path d="M391,157.0 L396,161.0 L391,165.0" fill="none" stroke="#284b63" stroke-width="1.5"/>
<rect x="398" y="102" width="258" height="118" rx="6" fill="#eef2f5" stroke="#284b63" stroke-width="1"/>
<text x="408" y="122" font-size="12.5" font-weight="700" fill="#b5541c">1864년 여름</text>
<text x="408" y="140" font-size="12" fill="#2b2b2b">아홉 살 데이지, 담즙열에 이어</text>
<text x="408" y="156" font-size="12" fill="#2b2b2b">장티푸스(5주).</text>
<text x="408" y="172" font-size="12" fill="#2b2b2b">나아지는 듯함</text>
<path d="M658,161.0 L667,161.0" stroke="#284b63" stroke-width="1.5"/>
<path d="M663,157.0 L668,161.0 L663,165.0" fill="none" stroke="#284b63" stroke-width="1.5"/>
<rect x="670" y="102" width="258" height="118" rx="6" fill="#eef2f5" stroke="#284b63" stroke-width="1"/>
<text x="680" y="122" font-size="12.5" font-weight="700" fill="#b5541c">마지막 3–4일</text>
<text x="680" y="140" font-size="12" fill="#2b2b2b">장염. 앨리가 곁에 있다고 말함.</text>
<text x="680" y="156" font-size="12" fill="#2b2b2b">모르는 것은 '앨리가 오면'</text>
<text x="680" y="172" font-size="12" fill="#2b2b2b">묻겠다고 함. 찾아온 이들에게</text>
<text x="680" y="188" font-size="12" fill="#2b2b2b">다른 죽은 이들을 말함</text>
<path d="M930,161.0 L939,161.0" stroke="#284b63" stroke-width="1.5"/>
<path d="M935,157.0 L940,161.0 L935,165.0" fill="none" stroke="#284b63" stroke-width="1.5"/>
<rect x="942" y="102" width="258" height="118" rx="6" fill="#eef2f5" stroke="#284b63" stroke-width="1"/>
<text x="952" y="122" font-size="12.5" font-weight="700" fill="#b5541c">1864년 10월 8일 밤 11시 반</text>
<text x="952" y="140" font-size="12" fill="#2b2b2b">"앨리가 나를 데리러 왔어"(11시 15분).</text>
<text x="952" y="156" font-size="12" fill="#2b2b2b">자기가 말한 그 시각에</text>
<text x="952" y="172" font-size="12" fill="#2b2b2b">"와, 앨리" — 아버지 품에서</text>
<text x="952" y="188" font-size="12" fill="#2b2b2b">숨짐. 어머니가 곁에 있었음</text>
<path d="M1071.0,220 L1071.0,228.0 L255.0,228.0 L255.0,233" fill="none" stroke="#284b63" stroke-width="1.2" stroke-dasharray="4,3"/>
<path d="M251.0,228 L255.0,234 L259.0,228" fill="none" stroke="#284b63" stroke-width="1.2"/>
<rect x="40" y="236" width="76" height="118" rx="4" fill="#284b63"/>
<text x="78.0" y="300.0" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">기록</text>
<rect x="126" y="236" width="258" height="118" rx="6" fill="#fbf1ea" stroke="#284b63" stroke-width="1"/>
<text x="136" y="256" font-size="12.5" font-weight="700" fill="#b5541c">'죽은 뒤 얼마 안 되어'</text>
<text x="136" y="274" font-size="12" fill="#2b2b2b">어머니가 마지막 말들을</text>
<text x="136" y="290" font-size="12" fill="#2b2b2b">공책에 적음. 메모는</text>
<text x="136" y="306" font-size="12" fill="#2b2b2b">보지 못함. 어머니의</text>
<text x="136" y="322" font-size="12" fill="#2b2b2b">서문으로만 알려짐</text>
<path d="M386,295.0 L395,295.0" stroke="#284b63" stroke-width="1.5"/>
<path d="M391,291.0 L396,295.0 L391,299.0" fill="none" stroke="#284b63" stroke-width="1.5"/>
<rect x="398" y="236" width="258" height="118" rx="6" fill="#fbf1ea" stroke="#284b63" stroke-width="1"/>
<text x="408" y="256" font-size="12.5" font-weight="700" fill="#b5541c">1872년</text>
<text x="408" y="274" font-size="12" fill="#2b2b2b">아버지 D. A. 드라이든 목사가</text>
<text x="408" y="290" font-size="12" fill="#2b2b2b">『그들은 일어난다』 출간:</text>
<text x="408" y="306" font-size="12" fill="#2b2b2b">죽은 이는 곧 영의 몸을 입는다.</text>
<text x="408" y="322" font-size="12" fill="#2b2b2b">데이지는 언급 없음</text>
<path d="M658,295.0 L667,295.0" stroke="#284b63" stroke-width="1.5"/>
<path d="M663,291.0 L668,295.0 L663,299.0" fill="none" stroke="#284b63" stroke-width="1.5"/>
<rect x="670" y="236" width="258" height="118" rx="6" fill="#fbf1ea" stroke="#284b63" stroke-width="1"/>
<text x="680" y="256" font-size="12.5" font-weight="700" fill="#b5541c">1894년 10월 · 30년 뒤</text>
<text x="680" y="274" font-size="12" fill="#2b2b2b">길로이에 사는 미망인이 된</text>
<text x="680" y="290" font-size="12" fill="#2b2b2b">어머니가 메모를 '주로'</text>
<text x="680" y="306" font-size="12" fill="#2b2b2b">바탕으로 회고록을 씀.</text>
<text x="680" y="322" font-size="12" fill="#2b2b2b">서문에 날짜</text>
<path d="M930,295.0 L939,295.0" stroke="#284b63" stroke-width="1.5"/>
<path d="M935,291.0 L940,295.0 L935,299.0" fill="none" stroke="#284b63" stroke-width="1.5"/>
<rect x="942" y="236" width="258" height="118" rx="6" fill="#fbf1ea" stroke="#284b63" stroke-width="1"/>
<text x="952" y="256" font-size="12.5" font-weight="700" fill="#b5541c">1901년경</text>
<text x="952" y="274" font-size="12" fill="#2b2b2b">회고록이 인쇄되기 전에</text>
<text x="952" y="290" font-size="12" fill="#2b2b2b">어머니 사망</text>
<text x="952" y="306" font-size="12" fill="#2b2b2b">(히긴스 1906, 하이슬롭 1918)</text>
<path d="M1071.0,354 L1071.0,362.0 L255.0,362.0 L255.0,367" fill="none" stroke="#284b63" stroke-width="1.2" stroke-dasharray="4,3"/>
<path d="M251.0,362 L255.0,368 L259.0,362" fill="none" stroke="#284b63" stroke-width="1.2"/>
<rect x="40" y="370" width="76" height="118" rx="4" fill="#284b63"/>
<text x="78.0" y="434.0" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">활자로</text>
<rect x="126" y="370" width="258" height="118" rx="6" fill="#e4ebe4" stroke="#284b63" stroke-width="1"/>
<text x="136" y="390" font-size="12.5" font-weight="700" fill="#b5541c">1905년</text>
<text x="136" y="408" font-size="12" fill="#2b2b2b">초판, 토론토 W. 브리그스,</text>
<text x="136" y="424" font-size="12" fill="#2b2b2b">58쪽. F. L. 히긴스 목사가</text>
<text x="136" y="440" font-size="12" fill="#2b2b2b">캐나다에 저작권 등록</text>
<path d="M386,429.0 L395,429.0" stroke="#284b63" stroke-width="1.5"/>
<path d="M391,425.0 L396,429.0 L391,433.0" fill="none" stroke="#284b63" stroke-width="1.5"/>
<rect x="398" y="370" width="258" height="118" rx="6" fill="#e4ebe4" stroke="#284b63" stroke-width="1"/>
<text x="408" y="390" font-size="12.5" font-weight="700" fill="#b5541c">1909년</text>
<text x="408" y="408" font-size="12" fill="#2b2b2b">제3판, 보스턴 콜로니얼 프레스,</text>
<text x="408" y="424" font-size="12" fill="#2b2b2b">히긴스의 1906년 서론.</text>
<text x="408" y="440" font-size="12" fill="#2b2b2b">한 부가 윌리엄 제임스의</text>
<text x="408" y="456" font-size="12" fill="#2b2b2b">서재에 들어감</text>
<path d="M658,429.0 L667,429.0" stroke="#284b63" stroke-width="1.5"/>
<path d="M663,425.0 L668,429.0 L663,433.0" fill="none" stroke="#284b63" stroke-width="1.5"/>
<rect x="670" y="370" width="258" height="118" rx="6" fill="#e4ebe4" stroke="#284b63" stroke-width="1"/>
<text x="680" y="390" font-size="12.5" font-weight="700" fill="#b5541c">1918년 6월</text>
<text x="680" y="408" font-size="12" fill="#2b2b2b">하이슬롭이 JASPR 12권 6호</text>
<text x="680" y="424" font-size="12" fill="#2b2b2b">375–391쪽에 회고록을 재수록.</text>
<text x="680" y="440" font-size="12" fill="#2b2b2b">살아 있는 언니의 허락</text>
<path d="M930,429.0 L939,429.0" stroke="#284b63" stroke-width="1.5"/>
<path d="M935,425.0 L940,429.0 L935,433.0" fill="none" stroke="#284b63" stroke-width="1.5"/>
<rect x="942" y="370" width="258" height="118" rx="6" fill="#e4ebe4" stroke="#284b63" stroke-width="1"/>
<text x="952" y="390" font-size="12.5" font-weight="700" fill="#b5541c">1918년 10월 →</text>
<text x="952" y="408" font-size="12" fill="#2b2b2b">하이슬롭이 뒤의 사례들을</text>
<text x="952" y="424" font-size="12" fill="#2b2b2b">'데이지 드라이든의 경우'와</text>
<text x="952" y="440" font-size="12" fill="#2b2b2b">비교. 바렛 1926이</text>
<text x="952" y="456" font-size="12" fill="#2b2b2b">3장에 재수록</text>
<rect x="40" y="514" width="1160" height="66" rx="6" fill="#ffffff" stroke="#b5541c" stroke-width="1"/>
<text x="52" y="534" font-size="12" fill="#2b2b2b">등급: S1 1(당시 메모를 바탕으로 한 목격자의 회고록, 메모는 못 봄) · S2 1(현장에 있던 이름 있는 목격자 한 명: 어머니) · S3 0(날짜 있는 기록까지 30년) ·</text>
<text x="52" y="550" font-size="12" fill="#2b2b2b">S4 0 · S6 1(조사자 없음, 54년 뒤 하이슬롭 재수록) · S7 2 → 3/10 → R C, 상한 없음 · V0(아이가 몰랐다는 죽은 이들에 관한 주장, 기록은 나중) ·</text>
<text x="52" y="566" font-size="12" fill="#2b2b2b">독립성 I2</text>
</svg>
