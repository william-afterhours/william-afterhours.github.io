<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="600" viewBox="0 0 1240 600" font-family="'Helvetica Neue',Helvetica,Arial,'Noto Sans',sans-serif">
<rect width="1240" height="600" fill="#faf8f8"/>
<text x="40" y="38" font-size="19" font-weight="700" fill="#2b2b2b">Lady Zhang, China, before 1793 — how the record reached paper, and the two routes of borrowing that stay open</text>
<text x="40" y="60" font-size="11.5" fill="#6b6b6b">Facts from §3, §4 and §11 of card DBV-CN-1793-zhang (Ji Yun, Guwang tingzhi, preface dated 1793; Siku catalogue ch. 125; Taishō no. 412). This is a</text>
<text x="40" y="75" font-size="11.5" fill="#6b6b6b">diagram by William, not a record.</text>
<rect x="40" y="102" width="76" height="118" rx="4" fill="#284b63"/>
<text x="78.0" y="166.0" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">RECORD</text>
<rect x="126" y="102" width="258" height="118" rx="6" fill="#fbf1ea" stroke="#284b63" stroke-width="1"/>
<text x="136" y="122" font-size="12.5" font-weight="700" fill="#b5541c">Before 1793 · undated</text>
<text x="136" y="140" font-size="12" fill="#2b2b2b">At the crisis of her illness</text>
<text x="136" y="156" font-size="12" fill="#2b2b2b">Lady Zhang says she sees</text>
<text x="136" y="172" font-size="12" fill="#2b2b2b">'those who went before', and</text>
<text x="136" y="188" font-size="12" fill="#2b2b2b">that her guides are her</text>
<text x="136" y="204" font-size="12" fill="#2b2b2b">husband's kin</text>
<path d="M386,161.0 L395,161.0" stroke="#284b63" stroke-width="1.5"/>
<path d="M391,157.0 L396,161.0 L391,165.0" fill="none" stroke="#284b63" stroke-width="1.5"/>
<rect x="398" y="102" width="258" height="118" rx="6" fill="#fbf1ea" stroke="#284b63" stroke-width="1"/>
<text x="408" y="122" font-size="12.5" font-weight="700" fill="#b5541c">At the bedside</text>
<text x="408" y="140" font-size="12" fill="#2b2b2b">She calls her daughters and</text>
<text x="408" y="156" font-size="12" fill="#2b2b2b">daughters-in-law to the bed.</text>
<text x="408" y="172" font-size="12" fill="#2b2b2b">The recorder's third aunt,</text>
<text x="408" y="188" font-size="12" fill="#2b2b2b">née Zhang, hears it in person</text>
<path d="M658,161.0 L667,161.0" stroke="#284b63" stroke-width="1.5"/>
<path d="M663,157.0 L668,161.0 L663,165.0" fill="none" stroke="#284b63" stroke-width="1.5"/>
<rect x="670" y="102" width="258" height="118" rx="6" fill="#fbf1ea" stroke="#284b63" stroke-width="1"/>
<text x="680" y="122" font-size="12.5" font-weight="700" fill="#b5541c">Told to Ji Yun</text>
<text x="680" y="140" font-size="12" fill="#2b2b2b">The aunt tells her nephew</text>
<text x="680" y="156" font-size="12" fill="#2b2b2b">Ji Yun (1724–1805), whose</text>
<text x="680" y="172" font-size="12" fill="#2b2b2b">grandmother was the dying</text>
<text x="680" y="188" font-size="12" fill="#2b2b2b">woman's elder sister. Date unknown</text>
<path d="M930,161.0 L939,161.0" stroke="#284b63" stroke-width="1.5"/>
<path d="M935,157.0 L940,161.0 L935,165.0" fill="none" stroke="#284b63" stroke-width="1.5"/>
<rect x="942" y="102" width="258" height="118" rx="6" fill="#fbf1ea" stroke="#284b63" stroke-width="1"/>
<text x="952" y="122" font-size="12.5" font-weight="700" fill="#b5541c">1793 · in print 1800</text>
<text x="952" y="140" font-size="12" fill="#2b2b2b">Ji Yun writes it into Guwang</text>
<text x="952" y="156" font-size="12" fill="#2b2b2b">tingzhi, ch. 3 (preface: 25th day,</text>
<text x="952" y="172" font-size="12" fill="#2b2b2b">7th month, guichou year of</text>
<text x="952" y="188" font-size="12" fill="#2b2b2b">Qianlong). Collected works 1800</text>
<rect x="40" y="236" width="76" height="118" rx="4" fill="#284b63"/>
<text x="78.0" y="300.0" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">ROUTE ②</text>
<rect x="126" y="236" width="258" height="118" rx="6" fill="#eef2f5" stroke="#284b63" stroke-width="1"/>
<text x="136" y="256" font-size="12.5" font-weight="700" fill="#b5541c">1603</text>
<text x="136" y="274" font-size="12" fill="#2b2b2b">Matteo Ricci, Tianzhu shiyi:</text>
<text x="136" y="290" font-size="12" fill="#2b2b2b">the soul does not perish;</text>
<text x="136" y="306" font-size="12" fill="#2b2b2b">heaven and hell after death</text>
<text x="136" y="322" font-size="12" fill="#2b2b2b">(Siku catalogue note)</text>
<path d="M386,295.0 L395,295.0" stroke="#284b63" stroke-width="1.5"/>
<path d="M391,291.0 L396,295.0 L391,299.0" fill="none" stroke="#284b63" stroke-width="1.5"/>
<rect x="398" y="236" width="258" height="118" rx="6" fill="#eef2f5" stroke="#284b63" stroke-width="1"/>
<text x="408" y="256" font-size="12.5" font-weight="700" fill="#b5541c">1608</text>
<text x="408" y="274" font-size="12" fill="#2b2b2b">Ricci, Jiren shipian: two of</text>
<text x="408" y="290" font-size="12" fill="#2b2b2b">its ten chapters are on</text>
<text x="408" y="306" font-size="12" fill="#2b2b2b">keeping the hour of death</text>
<text x="408" y="322" font-size="12" fill="#2b2b2b">in mind (Siku catalogue note)</text>
<path d="M658,295.0 L667,295.0" stroke="#284b63" stroke-width="1.5"/>
<path d="M663,291.0 L668,295.0 L663,299.0" fill="none" stroke="#284b63" stroke-width="1.5"/>
<rect x="670" y="236" width="258" height="118" rx="6" fill="#eef2f5" stroke="#284b63" stroke-width="1"/>
<text x="680" y="256" font-size="12.5" font-weight="700" fill="#b5541c">1772–1782</text>
<text x="680" y="274" font-size="12" fill="#2b2b2b">The Siku catalogue reviews</text>
<text x="680" y="290" font-size="12" fill="#2b2b2b">these Christian books. Ji Yun:</text>
<text x="680" y="306" font-size="12" fill="#2b2b2b">'after fifty I led the editing</text>
<text x="680" y="322" font-size="12" fill="#2b2b2b">of the palace books' (preface)</text>
<path d="M930,295.0 L939,295.0" stroke="#284b63" stroke-width="1.5"/>
<path d="M935,291.0 L940,295.0 L935,299.0" fill="none" stroke="#284b63" stroke-width="1.5"/>
<rect x="942" y="236" width="258" height="118" rx="6" fill="#eef2f5" stroke="#284b63" stroke-width="1"/>
<text x="952" y="256" font-size="12.5" font-weight="700" fill="#b5541c">Not checked</text>
<text x="952" y="274" font-size="12" fill="#2b2b2b">Whether any Christian text in</text>
<text x="952" y="290" font-size="12" fill="#2b2b2b">Chinese recorded deathbed</text>
<text x="952" y="306" font-size="12" fill="#2b2b2b">visitors, and whether any</text>
<text x="952" y="322" font-size="12" fill="#2b2b2b">reached this household → unknown</text>
<rect x="40" y="370" width="76" height="118" rx="4" fill="#284b63"/>
<text x="78.0" y="434.0" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">ROUTE ③</text>
<rect x="126" y="370" width="258" height="118" rx="6" fill="#e4ebe4" stroke="#284b63" stroke-width="1"/>
<text x="136" y="390" font-size="12.5" font-weight="700" fill="#b5541c">Attributed 7th century</text>
<text x="136" y="408" font-size="12" fill="#2b2b2b">Sutra of the Fundamental Vows</text>
<text x="136" y="424" font-size="12" fill="#2b2b2b">of Ksitigarbha (Taishō 412),</text>
<text x="136" y="440" font-size="12" fill="#2b2b2b">said to be translated by</text>
<text x="136" y="456" font-size="12" fill="#2b2b2b">Śikṣānanda of Khotan</text>
<path d="M386,429.0 L395,429.0" stroke="#284b63" stroke-width="1.5"/>
<path d="M391,425.0 L396,429.0 L391,433.0" fill="none" stroke="#284b63" stroke-width="1.5"/>
<rect x="398" y="370" width="258" height="118" rx="6" fill="#e4ebe4" stroke="#284b63" stroke-width="1"/>
<text x="408" y="390" font-size="12.5" font-weight="700" fill="#b5541c">Its deathbed passage</text>
<text x="408" y="408" font-size="12" fill="#2b2b2b">Even good people, at death,</text>
<text x="408" y="424" font-size="12" fill="#2b2b2b">see ghosts 'changed into</text>
<text x="408" y="440" font-size="12" fill="#2b2b2b">parents and other kin' who</text>
<text x="408" y="456" font-size="12" fill="#2b2b2b">come to lead them away</text>
<path d="M658,429.0 L667,429.0" stroke="#284b63" stroke-width="1.5"/>
<path d="M663,425.0 L668,429.0 L663,433.0" fill="none" stroke="#284b63" stroke-width="1.5"/>
<rect x="670" y="370" width="258" height="118" rx="6" fill="#e4ebe4" stroke="#284b63" stroke-width="1"/>
<text x="680" y="390" font-size="12.5" font-weight="700" fill="#b5541c">Origin disputed</text>
<text x="680" y="408" font-size="12" fill="#2b2b2b">No Sanskrit original found;</text>
<text x="680" y="424" font-size="12" fill="#2b2b2b">some scholars think it was</text>
<text x="680" y="440" font-size="12" fill="#2b2b2b">composed in China (lead only:</text>
<text x="680" y="456" font-size="12" fill="#2b2b2b">Buswell 1990, not opened)</text>
<path d="M930,429.0 L939,429.0" stroke="#284b63" stroke-width="1.5"/>
<path d="M935,425.0 L940,429.0 L935,433.0" fill="none" stroke="#284b63" stroke-width="1.5"/>
<rect x="942" y="370" width="258" height="118" rx="6" fill="#e4ebe4" stroke="#284b63" stroke-width="1"/>
<text x="952" y="390" font-size="12.5" font-weight="700" fill="#b5541c">In the record itself</text>
<text x="952" y="408" font-size="12" fill="#2b2b2b">'I have heard that the dying</text>
<text x="952" y="424" font-size="12" fill="#2b2b2b">see those who went before' —</text>
<text x="952" y="440" font-size="12" fill="#2b2b2b">the idea was already a saying</text>
<text x="952" y="456" font-size="12" fill="#2b2b2b">in her household → unknown</text>
<rect x="40" y="514" width="1160" height="66" rx="6" fill="#ffffff" stroke="#b5541c" stroke-width="1"/>
<text x="52" y="534" font-size="12" fill="#2b2b2b">Grades: S1 1 (a collector who heard the witness in person) · S2 1 (one named witness, present) · S3 0 (decades; undated) · S4 0 · S6 1 (collector with a family</text>
<text x="52" y="550" font-size="12" fill="#2b2b2b">interest, no checking) · S7 2 (Qing woodblock edition, scan opened) → 3/10 → R C · no verified information (V—) · independence I1 (routes ② and ③ unknown; ① ④ ⑤</text>
<text x="52" y="566" font-size="12" fill="#2b2b2b">ruled out)</text>
</svg>
